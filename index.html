    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border: 0 solid #e2e8f0; }
    html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    button, input, select, textarea { font-family: inherit; font-size: 100%; color: inherit; margin: 0; }
    button { background: transparent; cursor: pointer; }
    input, select, textarea { background: #fff; }
    h1, h2, h3, p { margin: 0; }
    svg { display: block; }
    .hidden { display: none !important; }
    .block { display: block; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .grid { display: grid; }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-1 { flex: 1 1 0%; }
    .shrink-0 { flex-shrink: 0; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .items-end { align-items: flex-end; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .col-span-2 { grid-column: span 2 / span 2; }

    .gap-1 { gap: 0.25rem; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-2\.5 { gap: 0.625rem; }
    .gap-3 { gap: 0.75rem; }

    const STORAGE_KEY = 'smartmart_pos_v2';
    const CLOUD_CFG_KEY = 'smartmart_cloud_cfg_v1';

    function loadCloudConfig() {
      try {
        const raw = localStorage.getItem(CLOUD_CFG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { enabled: false, url: '', storeId: 'SMARTMART-01', lastSync: '' };
    }

    let cloudConfig = loadCloudConfig();
    let cloudPushTimer = null;
    let cloudPollTimer = null;

    function saveCloudConfig() {
      try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudConfig)); } catch (e) {}
    }

    function getCloudEndpoint() {
      const base = (cloudConfig.url || '').trim().replace(/\/+$/, '');
      const store = (cloudConfig.storeId || 'SMARTMART-01').trim().replace(/[^a-zA-Z0-9_-]/g, '');
      if (!base.startsWith('https://')) return '';
      return `${base}/smartmart_stores/${store}.json`;
    }

    function getSharedPayload() {
      return {
        products: state.products,
        customers: state.customers,
        gifts: state.gifts,
        orders: state.orders,
        heldBills: state.heldBills,
        shift: state.shift,
        redemptions: state.redemptions,
        careLogs: state.careLogs,
        auditLogs: state.auditLogs,
        updatedAt: Date.now()
      };
    }

    function applySharedPayload(data) {
      if (!data || typeof data !== 'object') return false;
      if (Array.isArray(data.products)) state.products = data.products;
      if (Array.isArray(data.customers)) state.customers = data.customers;
      if (Array.isArray(data.gifts)) state.gifts = data.gifts;
      if (Array.isArray(data.orders)) state.orders = data.orders;
      if (Array.isArray(data.heldBills)) state.heldBills = data.heldBills;
      if (data.shift && typeof data.shift === 'object') state.shift = data.shift;
      if (Array.isArray(data.redemptions)) state.redemptions = data.redemptions;
      if (Array.isArray(data.careLogs)) state.careLogs = data.careLogs;
      if (Array.isArray(data.auditLogs)) state.auditLogs = data.auditLogs;
      return true;
    }

    async function pushToCloud(silent = true) {
      const endpoint = getCloudEndpoint();
      if (!cloudConfig.enabled || !endpoint) return false;
      try {
        const res = await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(getSharedPayload())
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        cloudConfig.lastSync = new Date().toTimeString().slice(0, 8);
        saveCloudConfig();
        updateSyncBadge();
        if (!silent) showToast('Đã đẩy dữ liệu lên đám mây!');
        return true;
      } catch (err) {
        if (!silent) showToast('Lỗi đẩy dữ liệu Cloud: kiểm tra URL & Rules Firebase', 'error');
        return false;
      }
    }

    async function pullFromCloud(silent = true) {
      const endpoint = getCloudEndpoint();
      if (!cloudConfig.enabled || !endpoint) return false;
      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && applySharedPayload(data)) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          cloudConfig.lastSync = new Date().toTimeString().slice(0, 8);
          saveCloudConfig();
          render(true);
          if (!silent) showToast('Đã tải dữ liệu mới nhất từ đám mây!');
          return true;
        } else {
          if (!silent) {
            await pushToCloud(true);
            showToast('Kho dữ liệu mới trên Cloud — đã khởi tạo dữ liệu cửa hàng!');
          }
          return true;
        }
      } catch (err) {
        if (!silent) showToast('Không thể kết nối Firebase. Kiểm tra lại URL https://...', 'error');
        return false;
      }
    }

    function scheduleCloudPush() {
      if (!cloudConfig.enabled) return;
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(() => pushToCloud(true), 600);
    }

    function startCloudPolling() {
      clearInterval(cloudPollTimer);
      if (cloudConfig.enabled && getCloudEndpoint()) {
        cloudPollTimer = setInterval(() => pullFromCloud(true), 6000);
      }
    }

    function updateSyncBadge() {
      const dot = document.getElementById('sync-dot');

      } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-300';
        label.textContent = 'Offline';
      }
    }

    async function connectCloudSync(pushFirst) {
      const url = (document.getElementById('cloud-url-input')?.value || '').trim();
      const storeId = (document.getElementById('cloud-store-input')?.value || 'SMARTMART-01').trim().toUpperCase();
      if (!url.startsWith('https://')) {
        showToast('Vui lòng nhập URL Firebase bắt đầu bằng https://', 'warn');
        return;
      }
      cloudConfig.url = url;
      cloudConfig.storeId = storeId || 'SMARTMART-01';
      cloudConfig.enabled = true;
      saveCloudConfig();
      const ok = pushFirst ? await pushToCloud(false) : await pullFromCloud(false);
      if (ok) {
        startCloudPolling();
        updateSyncBadge();
        closeModal();
        render(true);
      }
    }

    function disconnectCloudSync() {
      cloudConfig.enabled = false;
      saveCloudConfig();
      clearInterval(cloudPollTimer);
      updateSyncBadge();
      closeModal();
      render(true);
      showToast('Đã chuyển sang chế độ Offline trên máy');
    }

    const fmt = (n) => (Number(n) || 0).toLocaleString('vi-VN') + 'đ';

    function playBeep(freq = 1200, duration = 0.07) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration * 1000);
      } catch (e) {}
    }

    function showToast(msg, type = 'success') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-rose-600 text-white'
        : type === 'warn'
        ? 'bg-amber-500 text-white'
        : 'bg-slate-900 text-white';
      el.className = `${colors} text-xs font-medium px-3.5 py-2.5 rounded-xl shadow-lg flex items-center justify-between gap-2 transition-all duration-200`;
      el.innerHTML = `<span>${msg}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
      }, 2400);
    }

      return map[tier] || map['Thành viên'];
    }

    function calcCartTotals() {
      const subtotal = state.cart.reduce((s, item) => s + item.price * item.qty, 0);
      let promoDiscount = 0;
      const code = (state.promoCode || '').trim().toUpperCase();
      if (code === 'GIAM10') promoDiscount = Math.round(subtotal * 0.1);
      else if (code === 'SIEUTHI20K' && subtotal >= 100000) promoDiscount = 20000;
      else if (code === 'VIP50K' && subtotal >= 300000) promoDiscount = 50000;

      const customer = state.customers.find(c => c.id === state.selectedCustomerId);
      let pointsUsed = 0;
      let pointsDiscount = 0;
      if (state.usePoints && customer && customer.points > 0) {
        const maxDiscount = Math.max(0, subtotal - promoDiscount);
        const maxPtsPossible = Math.floor(maxDiscount / 100);
        pointsUsed = Math.min(customer.points, maxPtsPossible);
        pointsDiscount = pointsUsed * 100;
      }

      const total = Math.max(0, subtotal - promoDiscount - pointsDiscount);
      const mult = customer ? getTierMultiplier(customer.tier) : 1;
      const pointsEarned = customer ? Math.floor((total / 10000) * mult) : 0;

      return { subtotal, promoDiscount, pointsUsed, pointsDiscount, total, pointsEarned, customer };
    }

    function addToCart(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      if (!prod || prod.stock <= 0) {
        showToast('Sản phẩm đã hết hàng!', 'error');
        return;
      }
      const existing = state.cart.find(c => c.id === prodId);
      if (existing) {
        if (existing.qty >= prod.stock) {
          showToast(`Chỉ còn ${prod.stock} ${prod.unit} trong kho`, 'warn');
          return;
        }
        existing.qty += 1;
      } else {
        state.cart.push({ id: prod.id, name: prod.name, price: prod.price, cost: prod.cost, qty: 1, unit: prod.unit, emoji: prod.emoji });
      }
      playBeep(1350, 0.06);
      render();
    }

    function updateChangeDisplay(total) {
      const val = Number(document.getElementById('cash-input')?.value || 0);
      const disp = document.getElementById('change-display');
      if (disp) disp.textContent = fmt(Math.max(0, val - total));
    }

    function updateCartQty(idx, delta, method) {
      const item = state.cart[idx];
      if (!item) return;
      const prod = state.products.find(p => p.id === item.id);
      const next = item.qty + delta;
      if (next <= 0) state.cart.splice(idx, 1);
      else if (prod && next > prod.stock) { showToast(`Kho chỉ còn ${prod.stock}`, 'warn'); return; }
      else item.qty = next;
      render();
      openCartModal(method);
    }

    function applyPromo(method) {
      const val = document.getElementById('promo-input')?.value || '';
      state.promoCode = val.trim().toUpperCase();
      const { promoDiscount } = calcCartTotals();
      if (state.promoCode && promoDiscount === 0) showToast('Mã chưa hợp lệ hoặc chưa đạt giá trị tối thiểu', 'warn');
      else if (promoDiscount > 0) showToast(`Đã giảm ${fmt(promoDiscount)}!`);
      openCartModal(method);
    }

    function holdCurrentBill() {
      const cust = state.customers.find(c => c.id === state.selectedCustomerId);
      const now = new Date();
      const time = now.toTimeString().slice(0, 5);
      state.heldBills.push({
        time,
        customerId: state.selectedCustomerId,
        customerName: cust ? cust.name : 'Khách lẻ',
        cart: JSON.parse(JSON.stringify(state.cart))
      });
      state.cart = [];
      state.selectedCustomerId = null;
      state.promoCode = '';
      state.usePoints = false;
      closeModal();
      render();
      showToast('Đã treo đơn hàng tạm thời!');
    }

    function completeCheckout(method) {
      const { subtotal, promoDiscount, pointsUsed, pointsDiscount, total, pointsEarned, customer } = calcCartTotals();
      state.cart.forEach(ci => {
        const p = state.products.find(pr => pr.id === ci.id);
        if (p) p.stock = Math.max(0, p.stock - ci.qty);
      });
      if (customer) {
        customer.points = Math.max(0, customer.points - pointsUsed) + pointsEarned;
        customer.totalSpent += total;
        customer.visits += 1;
        customer.lastVisit = '2026-11-15';
        if (customer.totalSpent >= 15000000) customer.tier = 'Kim Cương';
        else if (customer.totalSpent >= 7000000) customer.tier = 'Vàng';
        else if (customer.totalSpent >= 3000000) customer.tier = 'Bạc';
      }

      const now = new Date();
      const time = now.toTimeString().slice(0, 5);
      const orderId = `HD-261115-${String(state.orders.length + 1).padStart(2, '0')}`;
      const newOrder = {
        id: orderId,
        time,
        branch: state.shift.branch,
        cashier: state.shift.cashier,
        customerId: customer ? customer.id : null,
        customerName: customer ? customer.name : 'Khách lẻ',
        items: JSON.parse(JSON.stringify(state.cart)),
        subtotal,
        discount: promoDiscount + pointsDiscount,
        pointsUsed,
        total,
        pointsEarned,
        method,
        status: 'Hoàn thành'
      };
      state.orders.unshift(newOrder);

      if (promoDiscount > 0) {
        state.auditLogs.unshift({
          id: 'AL' + Date.now(),
          time,
          branch: state.shift.branch,
          staff: state.shift.cashier,
          action: `Áp dụng mã ${state.promoCode}`,
          detail: `Giảm ${fmt(promoDiscount)} cho ${orderId}`,
          level: 'warn'
        });
      }

      state.cart = [];
      state.selectedCustomerId = null;
      state.promoCode = '';
      state.usePoints = false;
      playBeep(1600, 0.12);
      render();
      openReceiptModal(newOrder);
    }

    function redeemGift(custId, giftId) {
      const cust = state.customers.find(c => c.id === custId);
      const gift = state.gifts.find(g => g.id === giftId);
      if (!cust || !gift || cust.points < gift.pointsCost || gift.stock <= 0) return;
      cust.points -= gift.pointsCost;
      gift.stock -= 1;
      const time = new Date().toTimeString().slice(0, 5);
      state.redemptions.unshift({ customerName: cust.name, giftName: gift.name, points: gift.pointsCost, time });
      playBeep(1500, 0.1);
      render();
      showToast(`Đổi thành công "${gift.name}" cho ${cust.name}!`);
    }

    function renderInventory(container) {
      const lowCount = state.products.filter(p => p.stock <= 10).length;
      const totalVal = state.products.reduce((s, p) => s + p.stock * p.cost, 0);
      const q = state.invSearch.toLowerCase().trim();
      const filtered = state.products.filter(p => {
        const matchF = state.invFilter === 'all' || (state.invFilter === 'low' && p.stock <= 10);
        const matchQ = !q || p.name.toLowerCase().includes(q) || p.barcode.includes(q);
        return matchF && matchQ;
      });

      container.innerHTML = `
        <div class="p-3 space-y-3">
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-white p-2.5 rounded-2xl border border-slate-200">
              <div class="text-[10px] text-slate-500">Tổng mã SP</div>
              <div class="text-base font-extrabold text-slate-900">${state.products.length}</div>
            </div>
            <button onclick="state.invFilter = state.invFilter === 'low' ? 'all' : 'low'; render();" class="text-left p-2.5 rounded-2xl border ${state.invFilter === 'low' ? 'bg-amber-50 border-amber-400' : 'bg-white border-slate-200'}">
              <div class="text-[10px] text-amber-700 font-semibold">Sắp hết (≤10)</div>
              <div class="text-base font-extrabold text-amber-600">${lowCount}</div>
            </button>
            <div class="bg-white p-2.5 rounded-2xl border border-slate-200">
              <div class="text-[10px] text-slate-500">Vốn tồn kho</div>
              <div class="text-xs font-extrabold text-emerald-700 mt-1">${(totalVal / 1000000).toFixed(1)}tr</div>
            </div>
          </div>

          <div class="flex gap-2">
            <input id="inv-search-input" type="text" value="${state.invSearch}" placeholder="Tìm sản phẩm trong kho..." class="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs" />
            <button onclick="openAddProductModal()" class="px-3 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shrink-0">+ Thêm SP</button>
          </div>

          <div class="space-y-2">
            ${filtered.map(p => `
              <div class="bg-white p-3 rounded-2xl border border-slate-200 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="text-2xl">${p.emoji}</span>
                  <div class="min-w-0">
                    <div class="text-xs font-bold text-slate-800 truncate">${p.name}</div>
                    <div class="text-[11px] text-slate-500">Giá bán: ${fmt(p.price)} • Vốn: ${fmt(p.cost)}</div>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="text-xs font-extrabold px-2 py-1 rounded-lg ${p.stock <= 10 ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'}">${p.stock} ${p.unit}</span>
                  <button onclick="openStockInModal('${p.id}')" class="px-2.5 py-1.5 bg-slate-900 text-white rounded-lg text-[11px] font-semibold">+ Nhập</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('inv-search-input').addEventListener('input', (e) => {
        state.invSearch = e.target.value;
        render();
        const el = document.getElementById('inv-search-input');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }

    function openStockInModal(prodId) {
      const p = state.products.find(x => x.id === prodId);
      if (!p) return;
      openModal(`
        <div class="p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm">Nhập kho: ${p.name}</h3>
            <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
          </div>
          <div class="text-xs text-slate-500">Tồn hiện tại: <b>${p.stock} ${p.unit}</b></div>
          <input id="si-qty" type="number" value="20" min="1" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-bold" />
          <button onclick="confirmStockIn('${p.id}')" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Xác nhận nhập kho</button>
        </div>
      `);
    }

    function confirmStockIn(prodId) {
      const qty = Number(document.getElementById('si-qty').value || 0);
      const p = state.products.find(x => x.id === prodId);
      if (!p || qty <= 0) return;
      p.stock += qty;
      closeModal();
      render();
      showToast(`Đã nhập +${qty} ${p.unit} ${p.name}`);
    }

    function openAddProductModal() {
      openModal(`
        <div class="p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm">Thêm sản phẩm mới</h3>
            <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
          </div>
          <div class="space-y-2">
            <input id="np-name" type="text" placeholder="Tên sản phẩm" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs" />
            <input id="np-barcode" type="text" placeholder="Mã vạch EAN-13 (tự tạo nếu để trống)" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs" />
            <div class="grid grid-cols-2 gap-2">
              <input id="np-price" type="number" placeholder="Giá bán (đ)" class="px-3 py-2 border border-slate-200 rounded-xl text-xs" />
              <input id="np-stock" type="number" placeholder="Tồn đầu" value="20" class="px-3 py-2 border border-slate-200 rounded-xl text-xs" />
            </div>
          </div>
          <button onclick="confirmAddProduct()" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Lưu sản phẩm</button>
        </div>
      `);
    }

    function confirmAddProduct() {
      const name = document.getElementById('np-name').value.trim();
      const price = Number(document.getElementById('np-price').value || 0);
      const stock = Number(document.getElementById('np-stock').value || 0);
      const barcode = document.getElementById('np-barcode').value.trim() || ('893' + Math.floor(1000000000 + Math.random() * 8999999999));
      if (!name || price <= 0) { showToast('Nhập tên và giá bán hợp lệ', 'warn'); return; }
      state.products.unshift({ id: 'P' + Date.now(), barcode, name, category: 'Thực phẩm', price, cost: Math.round(price * 0.8), stock, unit: 'Cái', emoji: '📦' });
      closeModal();
      render();
      showToast(`Đã thêm ${name}`);
    }

    // ---------- TAB 4: ORDERS & Z-REPORT ----------
    function renderOrders(container) {
      const cashSales = state.orders.filter(o => o.status === 'Hoàn thành' && o.method === 'Tiền mặt').reduce((s, o) => s + o.total, 0);
      const qrSales = state.orders.filter(o => o.status === 'Hoàn thành' && o.method === 'VietQR').reduce((s, o) => s + o.total, 0);
      const cardSales = state.orders.filter(o => o.status === 'Hoàn thành' && o.method === 'Thẻ / Ví').reduce((s, o) => s + o.total, 0);
      const expectedDrawer = state.shift.openingCash + cashSales;

      container.innerHTML = `
        <div class="p-3 space-y-3">
          <!-- Z-Report Card -->
          <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-md space-y-2.5">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-[11px] text-slate-400">Báo cáo Ca hiện tại (${state.shift.id})</div>
                <div class="text-sm font-bold">Thu ngân: ${state.shift.cashier} • Từ ${state.shift.startTime}</div>
              </div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${state.shift.closed ? 'bg-slate-700 text-slate-300' : 'bg-emerald-500 text-white'}">${state.shift.closed ? 'Đã chốt ca' : 'Đang mở ca'}</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs pt-1 border-t border-slate-800">
              <div><span class="text-slate-400">Đầu ca:</span> <b>${fmt(state.shift.openingCash)}</b></div>
              <div><span class="text-slate-400">Tiền mặt:</span> <b class="text-emerald-400">${fmt(cashSales)}</b></div>
              <div><span class="text-slate-400">VietQR:</span> <b>${fmt(qrSales)}</b></div>
              <div><span class="text-slate-400">Thẻ / Ví:</span> <b>${fmt(cardSales)}</b></div>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-800">
              <div>
                <div class="text-[10px] text-slate-400">Tiền mặt dự kiến trong két</div>
                <div class="text-base font-extrabold text-amber-400">${fmt(expectedDrawer)}</div>
              </div>
              <button onclick="state.shift.closed = !state.shift.closed; render(); showToast(state.shift.closed ? 'Đã chốt ca & xuất Z-Report!' : 'Đã mở lại ca');" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold">
                ${state.shift.closed ? 'Mở lại ca' : 'Chốt ca (Z-Report)'}
              </button>
            </div>
          </div>

          <!-- Order List -->
          <div class="text-xs font-bold text-slate-700">Lịch sử hóa đơn (${state.orders.length})</div>
          <div class="space-y-2">
            ${state.orders.map((o, idx) => `
              <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-1.5">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-slate-900">${o.id} <span class="text-[10px] font-normal text-slate-500">• ${o.time}</span></span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${o.status === 'Hoàn thành' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${o.status}</span>
                </div>
                <div class="flex items-center justify-between text-xs">
                  <span class="text-slate-600">${o.customerName} • ${o.method}</span>
                  <span class="font-extrabold text-slate-900">${fmt(o.total)}</span>
                </div>
                <div class="flex gap-2 pt-1">
                  <button onclick="openReceiptByIndex(${idx})" class="flex-1 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-[11px] font-semibold">Xem K80</button>
                  ${o.status === 'Hoàn thành' ? `<button onclick="refundOrder('${o.id}')" class="flex-1 py-1.5 bg-rose-50 text-rose-700 rounded-lg text-[11px] font-semibold">Hoàn trả hàng</button>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openReceiptByIndex(idx) {
      const o = state.orders[idx];
      if (o) openReceiptModal(o);
    }

    function refundOrder(orderId) {
      const o = state.orders.find(x => x.id === orderId);
      if (!o || o.status !== 'Hoàn thành') return;
      o.status = 'Đã hoàn trả';
      o.items.forEach(i => {
        const p = state.products.find(pr => pr.id === i.id);
        if (p) p.stock += i.qty;
      });
      if (o.customerId) {
        const c = state.customers.find(cu => cu.id === o.customerId);
        if (c) c.points = Math.max(0, c.points - o.pointsEarned);
      }
      state.auditLogs.unshift({
        id: 'AL' + Date.now(),
        time: new Date().toTimeString().slice(0, 5),
        branch: o.branch,
        staff: state.shift.cashier,
        action: `Hoàn trả ${o.id}`,
        detail: `Hoàn ${fmt(o.total)} & nhập lại kho`,
        level: 'danger'
      });
      render();
      showToast(`Đã hoàn trả ${orderId} và cộng lại tồn kho!`);
    }

    // ---------- TAB 5: REMOTE OWNER DASHBOARD ----------
    function renderOwner(container) {
      const branchOrders = state.orders.filter(o => o.status === 'Hoàn thành' && (state.ownerBranch === 'Tất cả chi nhánh' || o.branch === state.ownerBranch));
      const revenue = branchOrders.reduce((s, o) => s + o.total, 0);
      const costTotal = branchOrders.reduce((s, o) => s + o.items.reduce((si, i) => si + (i.cost || i.price * 0.8) * i.qty, 0), 0);
      const profit = Math.max(0, revenue - costTotal);
      const avgBasket = branchOrders.length > 0 ? Math.round(revenue / branchOrders.length) : 0;
      const lowStockItems = state.products.filter(p => p.stock <= 10);

      container.innerHTML = `
        <div class="p-3 space-y-3">
          <!-- Remote Filter Bar -->
          <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex items-center justify-between gap-2">
              <select id="owner-branch-select" class="flex-1 text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2">
                <option ${state.ownerBranch === 'Tất cả chi nhánh' ? 'selected' : ''}>Tất cả chi nhánh</option>
                <option ${state.ownerBranch === 'CN1 - Trảng Bàng' ? 'selected' : ''}>CN1 - Trảng Bàng</option>
                <option ${state.ownerBranch === 'CN2 - Gò Dầu' ? 'selected' : ''}>CN2 - Gò Dầu</option>
              </select>
              <button onclick="cloudConfig.enabled ? pullFromCloud(false) : openCloudSyncModal();" class="px-3 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shrink-0 active:scale-95">↻ Đồng bộ</button>
            </div>
            <button onclick="openCloudSyncModal()" class="w-full flex items-center justify-between text-[11px] px-2.5 py-1.5 rounded-xl ${cloudConfig.enabled && getCloudEndpoint() ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-800'}">
              <span>${cloudConfig.enabled && getCloudEndpoint() ? `☁️ Đang đồng bộ mã: <b>${cloudConfig.storeId}</b> (${cloudConfig.lastSync || 'vừa xong'})` : '⚠️ Chưa bật Đồng bộ Đám mây — Chạm để kết nối máy nhân viên'}</span>
              <span class="font-bold underline">Cài đặt</span>
            </button>
          </div>

          <!-- KPI 2x2 -->
          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-3 rounded-2xl shadow-sm">
              <div class="text-[11px] text-emerald-100">Doanh thu thuần</div>
              <div class="text-lg font-extrabold mt-0.5">${fmt(revenue)}</div>
              <div class="text-[10px] text-emerald-200 mt-1">Cập nhật theo thời gian thực</div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-[11px] text-slate-500">Lợi nhuận gộp (ước tính)</div>
              <div class="text-lg font-extrabold text-emerald-700 mt-0.5">${fmt(profit)}</div>
              <div class="text-[10px] text-slate-400 mt-1">Biên LN: ${revenue > 0 ? Math.round((profit / revenue) * 100) : 0}%</div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-[11px] text-slate-500">Số đơn hàng</div>
              <div class="text-base font-extrabold text-slate-900">${branchOrders.length} đơn</div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-[11px] text-slate-500">Giá trị TB / đơn</div>
              <div class="text-base font-extrabold text-slate-900">${fmt(avgBasket)}</div>
            </div>
          </div>

          <!-- Revenue Chart -->
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-xs font-bold text-slate-800">Biểu đồ doanh thu theo khung giờ</h3>
              <span class="text-[10px] text-emerald-600 font-semibold">Hôm nay</span>
            </div>
            <div class="relative h-48">
              <canvas id="owner-revenue-chart"></canvas>
            </div>
          </div>

          <!-- Remote Staff & Audit Monitor -->
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-800">Giám sát quầy & Nhật ký nhạy cảm</h3>
              <span class="text-[10px] bg-rose-50 text-rose-700 font-semibold px-2 py-0.5 rounded-full">Chống thất thoát</span>
            </div>
            <div class="space-y-1.5">
              ${state.auditLogs.slice(0, 5).map(a => `
                <div class="flex items-start justify-between gap-2 text-[11px] p-2 rounded-xl ${a.level === 'danger' ? 'bg-rose-50 text-rose-900' : a.level === 'warn' ? 'bg-amber-50 text-amber-900' : 'bg-slate-50 text-slate-700'}">
                  <div>
                    <div class="font-bold">${a.action} • ${a.staff}</div>
                    <div class="opacity-80">${a.detail} (${a.branch})</div>
                  </div>
                  <span class="text-[10px] opacity-70 shrink-0">${a.time}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Low Stock Alert -->
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-800">Cảnh báo tồn kho từ xa (${lowStockItems.length})</h3>
              <button onclick="state.activeTab='inventory'; state.invFilter='low'; render();" class="text-[11px] font-semibold text-emerald-600">Xử lý nhập kho →</button>
            </div>
            <div class="space-y-1.5">
              ${lowStockItems.map(p => `
                <div class="flex items-center justify-between text-xs py-1 border-b border-slate-100 last:border-0">
                  <span class="truncate text-slate-700">${p.emoji} ${p.name}</span>
                  <span class="font-bold text-rose-600 shrink-0 ml-2">Còn ${p.stock} ${p.unit}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('owner-branch-select').addEventListener('change', (e) => {
        state.ownerBranch = e.target.value;
        render();
      });

      const ctx = document.getElementById('owner-revenue-chart').getContext('2d');
      if (ownerChartInstance) ownerChartInstance.destroy();
      const hours = ['08h', '09h', '10h', '11h', '12h', '13h', '14h'];
      const hourlyData = hours.map(h => {
        const prefix = h.slice(0, 2);
        return branchOrders.filter(o => o.time.startsWith(prefix)).reduce((s, o) => s + o.total, 0);
      });
      if (typeof Chart === 'undefined') {
        const box = document.getElementById('owner-revenue-chart').parentElement;
        const maxVal = Math.max(1, ...hourlyData);
        box.innerHTML = `<div class="h-full flex items-end justify-between gap-2 pt-4 pb-1 px-1">` +
          hours.map((h, i) => `<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">
            <div class="w-full bg-emerald-500 rounded-t" style="height:${Math.max(4, Math.round((hourlyData[i]/maxVal)*100))}%"></div>
            <span class="text-[10px] text-slate-500">${h}</span>
          </div>`).join('') + `</div>`;
        return;
      }
      ownerChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: hours,
          datasets: [{
            label: 'Doanh thu (đ)',
            data: hourlyData,
            backgroundColor: '#10b981',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                font: { size: 10 },
                callback: (v) => (v >= 1000 ? (v / 1000) + 'k' : v)
              }
            },
            x: { ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    // ==========================================
    // 4. GLOBAL NAVIGATION & INIT
    // ==========================================
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('btn-role-switch').addEventListener('click', () => {
      state.activeTab = state.activeTab === 'owner' ? 'pos' : 'owner';
      render();
    });

    window.addEventListener('DOMContentLoaded', () => { render(true); startCloudPolling(); if (cloudConfig.enabled) pullFromCloud(true); });
  </script>
</body>
</html>

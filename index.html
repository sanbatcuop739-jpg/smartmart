<body class="bg-slate-100 text-slate-900 min-h-screen">

              <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
          </div>

            <div class="flex items-center gap-1.5">
              <h1 id="header-brand" class="font-bold text-sm tracking-tight truncate">Mini Mart 2 POS</h1>
              <button id="btn-cloud-sync" onclick="openCloudSyncModal()" class="inline-flex items-center gap-1 text-[10px] font-semibold bg-emerald-900/45 hover:bg-emerald-900/70 px-2 py-0.5 rounded-full border border-white/15 transition active:scale-95">
                <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-amber-300"></span>
                <span id="sync-label">Cài Cloud</span>
              </button>
            </div>
            <p class="text-[11px] text-emerald-100 truncate" id="header-subtitle">CN1 Trảng Bàng • Ca: Minh Anh</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-role-switch" class="text-[11px] font-semibold bg-white/15 hover:bg-white/25 active:scale-95 transition px-2.5 py-1.5 rounded-lg border border-white/20 flex items-center gap-1">

              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>

  <!-- Toast Notification -->

  <script>
    // ==========================================
    // 1. INITIAL DATA & STATE MANAGEMENT
    // ==========================================
    const STORAGE_KEY = 'smartmart_pos_v2';
    const CLOUD_CFG_KEY = 'smartmart_cloud_cfg_v1';

    function loadCloudConfig() {
      try {
        const raw = localStorage.getItem(CLOUD_CFG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { enabled: false, url: '', storeId: 'SMARTMART-01', lastSync: '' };
    }

    let cloudConfig = loadCloudConfig();
    let cloudPushTimer = null;
    let cloudPollTimer = null;

    function saveCloudConfig() {
      try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudConfig)); } catch (e) {}
    }

    function getCloudEndpoint() {
      const base = (cloudConfig.url || '').trim().replace(/\/+$/, '');
      const store = (cloudConfig.storeId || 'SMARTMART-01').trim().replace(/[^a-zA-Z0-9_-]/g, '');
      if (!base.startsWith('https://')) return '';
      return `${base}/smartmart_stores/${store}.json`;
    }

    function getSharedPayload() {
      return {
        branches: state.branches,
        weeklySchedule: state.weeklySchedule,
        staffList: state.staffList,
        categories: state.categories,
        tierThresholds: state.tierThresholds,
        promoSeq: state.promoSeq,
        promos: state.promos,
        products: state.products,
        customers: state.customers,
        gifts: state.gifts,
        orders: state.orders,
        heldBills: state.heldBills,
        shift: state.shift,
        redemptions: state.redemptions,
        careLogs: state.careLogs,
        cashDrawerLogs: state.cashDrawerLogs,
        drawerCounts: state.drawerCounts,
        stockLogs: state.stockLogs,
        auditLogs: state.auditLogs,
        updatedAt: Date.now()
      };
    }

    function applySharedPayload(data) {
      if (!data || typeof data !== 'object') return false;
      if (Array.isArray(data.branches)) state.branches = data.branches;
      if (data.weeklySchedule && typeof data.weeklySchedule === 'object') state.weeklySchedule = data.weeklySchedule;
      if (Array.isArray(data.staffList)) state.staffList = data.staffList;
      if (Array.isArray(data.categories)) state.categories = data.categories;
      if (data.tierThresholds && typeof data.tierThresholds === 'object') state.tierThresholds = data.tierThresholds;
      if (typeof data.promoSeq === 'number') state.promoSeq = data.promoSeq;
      if (Array.isArray(data.promos)) state.promos = data.promos;
      if (Array.isArray(data.products)) state.products = data.products;
      if (Array.isArray(data.customers)) state.customers = data.customers;
      if (Array.isArray(data.gifts)) state.gifts = data.gifts;
      if (Array.isArray(data.orders)) state.orders = data.orders;
      if (Array.isArray(data.heldBills)) state.heldBills = data.heldBills;
      if (data.shift && typeof data.shift === 'object') state.shift = data.shift;
      if (Array.isArray(data.redemptions)) state.redemptions = data.redemptions;
      if (Array.isArray(data.careLogs)) state.careLogs = data.careLogs;
      if (Array.isArray(data.cashDrawerLogs)) state.cashDrawerLogs = data.cashDrawerLogs;
      if (data.drawerCounts && typeof data.drawerCounts === 'object') state.drawerCounts = data.drawerCounts;
      if (Array.isArray(data.stockLogs)) state.stockLogs = data.stockLogs;
      if (Array.isArray(data.auditLogs)) state.auditLogs = data.auditLogs;
      return true;
    }

    async function pushToCloud(silent = true) {
      const endpoint = getCloudEndpoint();
      if (!cloudConfig.enabled || !endpoint) return false;
      try {
        const res = await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(getSharedPayload())
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        cloudConfig.lastSync = new Date().toTimeString().slice(0, 8);
        saveCloudConfig();
        updateSyncBadge();
        if (!silent) showToast('Đã đẩy dữ liệu lên đám mây!');
        return true;
      } catch (err) {
        if (!silent) showToast('Lỗi đẩy dữ liệu Cloud: kiểm tra URL & Rules Firebase', 'error');
        return false;
      }
    }

    async function pullFromCloud(silent = true) {
      const endpoint = getCloudEndpoint();
      if (!cloudConfig.enabled || !endpoint) return false;
      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && applySharedPayload(data)) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          cloudConfig.lastSync = new Date().toTimeString().slice(0, 8);
          saveCloudConfig();
          render(true);
          if (!silent) showToast('Đã tải dữ liệu mới nhất từ đám mây!');
          return true;
        } else {
          if (!silent) {
            await pushToCloud(true);
            showToast('Kho dữ liệu mới trên Cloud — đã khởi tạo dữ liệu cửa hàng!');
          }
          return true;
        }
      } catch (err) {
        if (!silent) showToast('Không thể kết nối Firebase. Kiểm tra lại URL https://...', 'error');
        return false;
      }
    }

    function scheduleCloudPush() {
      if (!cloudConfig.enabled) return;
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(() => pushToCloud(true), 600);
    }

    function startCloudPolling() {
      clearInterval(cloudPollTimer);
      if (cloudConfig.enabled && getCloudEndpoint()) {
        cloudPollTimer = setInterval(() => pullFromCloud(true), 6000);
      }
    }

    function updateSyncBadge() {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      if (!dot || !label) return;
      if (cloudConfig.enabled && getCloudEndpoint()) {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-lime-400 live-dot';
        label.textContent = 'Cloud Live';
      } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-300';
        label.textContent = 'Offline';
      }
    }

          </div>

          </div>
          ${isConn ? `

          ` : ''}

          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-600 space-y-1">
            <div class="font-bold text-slate-800">Hướng dẫn tạo Firebase miễn phí (2 phút):</div>
            <div>1. Vào <b>console.firebase.google.com</b> → Tạo dự án mới (Miễn phí).</div>
            <div>2. Chọn <b>Build → Realtime Database → Create Database</b> (chọn Singapore).</div>
            <div>3. Ở tab <b>Rules</b>, đổi <code>.read</code> và <code>.write</code> thành <code>true</code> (hoặc dùng trong nội bộ) rồi copy đường dẫn <code>https://...firebasedatabase.app</code> dán vào ô trên.</div>
          </div>

          <button onclick="resetDemoData()" class="w-full py-2 bg-slate-100 text-slate-600 rounded-xl text-[11px] font-semibold">Khôi phục dữ liệu mẫu ban đầu</button>
        </div>
      `);
    }

    async function connectCloudSync(pushFirst) {
      const url = (document.getElementById('cloud-url-input')?.value || '').trim();
      const storeId = (document.getElementById('cloud-store-input')?.value || 'SMARTMART-01').trim().toUpperCase();
      if (!url.startsWith('https://')) {
        showToast('Vui lòng nhập URL Firebase bắt đầu bằng https://', 'warn');
        return;
      }
      cloudConfig.url = url;
      cloudConfig.storeId = storeId || 'SMARTMART-01';
      cloudConfig.enabled = true;
      saveCloudConfig();
      const ok = pushFirst ? await pushToCloud(false) : await pullFromCloud(false);
      if (ok) {
        startCloudPolling();
        updateSyncBadge();
        closeModal();
        render(true);
      }
    }

    function disconnectCloudSync() {
      cloudConfig.enabled = false;
      saveCloudConfig();
      clearInterval(cloudPollTimer);
      updateSyncBadge();
      closeModal();
      render(true);
      showToast('Đã chuyển sang chế độ Offline trên máy');
    }

    }

    function getCashDrawerSummary() {
      const cashSales = state.orders
        .filter(o => o.status === 'Hoàn thành' && o.method === 'Tiền mặt')
        .reduce((s, o) => s + o.total, 0);
      const cashIn = (state.cashDrawerLogs || [])
        .filter(l => l.type === 'in')
        .reduce((s, l) => s + (l.amount || 0), 0);
      const cashOut = (state.cashDrawerLogs || [])
        .filter(l => l.type === 'out')
        .reduce((s, l) => s + (l.amount || 0), 0);
      const opening = Number((state.shift && state.shift.openingCash) || 0);
      const expected = opening + cashSales + cashIn - cashOut;
      const counted = VND_DENOMS.reduce((s, d) => s + d * Number((state.drawerCounts && state.drawerCounts[d]) || 0), 0);
      return { opening, cashSales, cashIn, cashOut, expected, counted, diff: counted - expected };
    }

    function playBeep(freq = 1200, duration = 0.07) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration * 1000);
      } catch (e) {}
    }

    function showToast(msg, type = 'success') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-rose-600 text-white'
        : type === 'warn'
        ? 'bg-amber-500 text-white'
        : 'bg-slate-900 text-white';
      el.className = `${colors} text-xs font-medium px-3.5 py-2.5 rounded-xl shadow-lg flex items-center justify-between gap-2 transition-all duration-200`;
      el.innerHTML = `<span>${msg}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
      }, 2400);
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');

      document.getElementById('modal-root').classList.add('hidden');

    function recalcCustomerTier(c) {
      if (!c) return;
      const th = state.tierThresholds || { diamond: 1200, gold: 500, silver: 200 };
      if ((c.points || 0) >= Number(th.diamond || 1200)) c.tier = 'Kim Cương';
      else if ((c.points || 0) >= Number(th.gold || 500)) c.tier = 'Vàng';
      else if ((c.points || 0) >= Number(th.silver || 200)) c.tier = 'Bạc';
      else c.tier = 'Thành viên';
    }

    function recalcAllCustomerTiers() {
      (state.customers || []).forEach(c => recalcCustomerTier(c));
    }

    function getMemberTopRanking(pr) {
      const sDate = pr.startDate || '';
      const eDate = pr.endDate || '';
      const target = pr.memberTier || 'Tất cả';
      const scored = (state.customers || [])
        .filter(c => target === 'Tất cả' || c.tier === target)
        .map(c => {
          const periodPts = (state.orders || [])
            .filter(o => o.status === 'Hoàn thành' && o.customerId === c.id && (!sDate || (o.isoDate || '') >= sDate) && (!eDate || (o.isoDate || '') <= eDate))
            .reduce((s, o) => s + (o.pointsEarned || 0), 0);
          return { customer: c, racePoints: periodPts };
        })
        .sort((a, b) => b.racePoints - a.racePoints);
      const topN = Math.max(1, Number(pr.memberTopN || 3));
      return scored.slice(0, topN);
    }

          <button onclick="notifyZaloForMemberPromo(state.promos.find(p=>p.id==='${pr.id}')); openPromoManagerModal();" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">📲 Thông báo Zalo trao thưởng Top ${pr.memberTopN || 3}</button>
        </div>

    function getCustomerMemberPromos(c) {
      if (!c) return [];
      return (state.promos || []).filter(pr => {
        if (pr.type !== 'member_tier' || !getPromoStatus(pr).valid) return false;
        const target = pr.memberTier || 'Tất cả';
        const matchTier = target === 'Tất cả' || c.tier === target;
        if (!matchTier) return false;
        if (pr.memberMode === 'top_race') {
          return getMemberTopRanking(pr).some(r => r.customer.id === c.id);
        }
        return (c.points || 0) >= Number(pr.memberMinPts || 0);
      });
    }

    function notifyZaloForMemberPromo(pr, silent = false) {
      if (!pr || pr.type !== 'member_tier') return 0;
      const targets = pr.memberMode === 'top_race'
        ? getMemberTopRanking(pr).map(r => r.customer).filter(c => c.phone)
        : (state.customers || []).filter(c => {
            if (!c.phone) return false;
            const target = pr.memberTier || 'Tất cả';
            return (target === 'Tất cả' || c.tier === target) && (c.points || 0) >= Number(pr.memberMinPts || 0);
          });
      const time = new Date().toTimeString().slice(0, 5);
      targets.forEach(c => {
        const msg = `[Tự động Zalo ${c.phone}] Chào ${c.name} (Hạng ${c.tier} - ${c.points} điểm), bạn nhận được "${pr.name}" (${pr.code})${pr.startDate || pr.endDate ? ` từ ${pr.startDate || '...'} đến ${pr.endDate || '...'}` : ''}!`;
        state.careLogs.unshift({ id: 'CL' + Date.now() + Math.random(), time, customerName: `${c.name} (${c.phone})`, channel: 'Zalo OA (Tự động)', message: msg });
      });
      if (!silent && targets.length > 0) showToast(`📲 Đã tự động gửi thông báo Zalo tới ${targets.length} khách hàng đủ điều kiện!`);
      return targets.length;
    }

    function getTierMultiplier(tier) {
      if (tier === 'Kim Cương') return 1.5;
      if (tier === 'Vàng') return 1.2;
      if (tier === 'Bạc') return 1.1;
      return 1.0;
    }

    function getTierBadge(tier) {
      const map = {
        'Kim Cương': 'bg-cyan-100 text-cyan-800 border-cyan-200',
        'Vàng': 'bg-amber-100 text-amber-800 border-amber-200',
        'Bạc': 'bg-slate-200 text-slate-700 border-slate-300',
        'Thành viên': 'bg-emerald-50 text-emerald-700 border-emerald-200'
      };
      return map[tier] || map['Thành viên'];
    }

    function generateAutoPromoCode(startDateStr, seqNum) {
      const d = (startDateStr && /^\d{4}-\d{2}-\d{2}$/.test(startDateStr)) ? startDateStr : getTodayStr();
      const yy = d.slice(2, 4);
      const mm = d.slice(5, 7);
      const seq = String(seqNum).padStart(2, '0');
      return `MN${seq}${mm}${yy}`;
    }

    function isPromoConditionMet(pr, subtotal) {
      if (!getPromoStatus(pr).valid) return false;
      if (pr.type === 'member_tier') {
        const cust = state.customers.find(c => c.id === state.selectedCustomerId);
        if (!cust) return false;
        const target = pr.memberTier || 'Tất cả';
        if (target !== 'Tất cả' && cust.tier !== target) return false;
        if (pr.memberMode === 'top_race') {
          if (!getMemberTopRanking(pr).some(r => r.customer.id === cust.id)) return false;
        } else if ((cust.points || 0) < Number(pr.memberMinPts || 0)) return false;
      }
      if (subtotal < (pr.minOrder || 0)) return false;
      if ((pr.condMode === 'combo' || pr.condMode === 'both') && Array.isArray(pr.comboIds) && pr.comboIds.length > 0) {
        if (!pr.comboIds.every(pid => state.cart.some(ci => ci.id === pid))) return false;
      }
      if (pr.type === 'product_promo') {
        if (!pr.targetProdId || !state.cart.some(ci => ci.id === pr.targetProdId)) return false;
      }
      const scope = pr.scope || 'all';
      if (scope !== 'all') {
        const hasCatItem = state.cart.some(item => {
          const p = state.products.find(x => x.id === item.id);
          return p && p.category === scope;
        });
        if (!hasCatItem) return false;
      }
      return true;
    }

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getPromoStatus(pr) {
      if (!pr.active) return { valid: false, label: 'Đã tắt', cls: 'bg-slate-100 text-slate-500' };
      const today = getTodayStr();
      if (pr.startDate && today < pr.startDate) return { valid: false, label: 'Chưa bắt đầu', cls: 'bg-blue-100 text-blue-700' };
      if (pr.endDate && today > pr.endDate) return { valid: false, label: 'Đã hết hạn', cls: 'bg-rose-100 text-rose-700' };
      return { valid: true, label: 'Đang diễn ra', cls: 'bg-emerald-100 text-emerald-700' };
    }

    function calcCartTotals() {
      const subtotal = state.cart.reduce((s, item) => s + item.price * item.qty, 0);
      let promoDiscount = 0;
      let bonusPoints = 0;
      const eligiblePromos = (state.promos || []).filter(pr => isPromoConditionMet(pr, subtotal));
      const code = (state.promoCode || '').trim().toUpperCase();
      const manualMatch = code ? eligiblePromos.find(pr => pr.code.toUpperCase() === code) : null;

      let bestDiscPromo = manualMatch && manualMatch.type !== 'custom' ? manualMatch : null;
      let bestDiscVal = 0;
      const calcPromoVal = (pr) => {
        const scope = pr.scope || 'all';
        const elSub = scope === 'all' ? subtotal : state.cart.reduce((s, item) => {
          const p = state.products.find(x => x.id === item.id);
          return s + (p && p.category === scope ? item.price * item.qty : 0);
        }, 0);
        if (pr.type === 'percent') return Math.round(elSub * (pr.value / 100));
        if (pr.type === 'fixed') return Math.min(elSub, pr.value || 0);
        if (pr.type === 'member_tier') {
          if (pr.memberDiscType === 'fixed') return Math.min(elSub, pr.value || 0);
          if (pr.memberDiscType === 'percent') return Math.round(elSub * ((pr.value || 0) / 100));
          return 0;
        }
        if (pr.type === 'product_promo') {
          const ci = state.cart.find(item => item.id === pr.targetProdId);
          if (!ci) return 0;
          const lineTotal = ci.price * ci.qty;
          if (pr.prodDiscType === 'fixed') return Math.min(lineTotal, (pr.value || 0) * ci.qty);
          if (pr.prodDiscType === 'flat_price') return Math.max(0, (ci.price - (pr.value || 0)) * ci.qty);
          return Math.round(lineTotal * ((pr.value || 0) / 100));
        }
        return 0;
      };

      if (bestDiscPromo) {
        bestDiscVal = calcPromoVal(bestDiscPromo);
      } else {
        eligiblePromos.filter(pr => pr.type === 'percent' || pr.type === 'fixed' || pr.type === 'member_tier' || pr.type === 'product_promo').forEach(pr => {
          const v = calcPromoVal(pr);
          if (v > bestDiscVal) { bestDiscVal = v; bestDiscPromo = pr; }
        });
      }
      promoDiscount = bestDiscVal;

      eligiblePromos.filter(pr => pr.type === 'gift_points').forEach(pr => {
        bonusPoints += (pr.value || 0);
      });

      const eligibleCustomPromos = eligiblePromos.filter(pr => pr.type === 'custom');
      const autoCustomPromo = (manualMatch && manualMatch.type === 'custom')
        ? manualMatch
        : (eligibleCustomPromos[0] || null);

      const appliedPromo = autoCustomPromo || bestDiscPromo || eligiblePromos.find(pr => pr.type === 'gift_points') || null;
      const extraCustom = Math.max(0, Number(state.customDiscount || 0));
      promoDiscount = Math.min(subtotal, promoDiscount + extraCustom);

      const customer = state.customers.find(c => c.id === state.selectedCustomerId);
      let pointsUsed = 0;
      let pointsDiscount = 0;
      if (state.usePoints && customer && customer.points > 0) {
        const maxDiscount = Math.max(0, subtotal - promoDiscount);
        const maxPtsPossible = Math.floor(maxDiscount / 100);
        pointsUsed = Math.min(customer.points, maxPtsPossible);
        pointsDiscount = pointsUsed * 100;
      }

      const total = Math.max(0, subtotal - promoDiscount - pointsDiscount);
      const mult = customer ? getTierMultiplier(customer.tier) : 1;
      const pointsEarned = (customer || (state.checkoutGuest && (state.checkoutGuest.phone || state.checkoutGuest.name || state.checkoutGuest.cccd))) ? (Math.floor((total / 1000) * mult) + bonusPoints) : 0;

      return { subtotal, promoDiscount, pointsUsed, pointsDiscount, total, pointsEarned, customer, appliedPromo, eligibleCustomPromos, extraCustom };
    }

      if (field === 'phone' || field === 'cccd') {
        const found = state.customers.find(c =>
          (field === 'phone' && clean.length >= 9 && c.phone === clean) ||
          (field === 'cccd' && clean.length >= 9 && c.cccd && c.cccd === clean)
        );
        if (found) {
          state.selectedCustomerId = found.id;

          const nEl = document.getElementById('d-chk-name');

    function addToCart(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      if (!prod || prod.stock <= 0) {
        showToast('Sản phẩm đã hết hàng!', 'error');
        return;
      }
      const existing = state.cart.find(c => c.id === prodId);
      if (existing) {
        if (existing.qty >= prod.stock) {
          showToast(`Chỉ còn ${prod.stock} ${prod.unit} trong kho`, 'warn');
          return;
        }
        existing.qty += 1;
      } else {
        state.cart.push({ id: prod.id, name: prod.name, price: prod.price, cost: prod.cost, qty: 1, unit: prod.unit, emoji: prod.emoji, image: prod.image || '' });
      }
      playBeep(1350, 0.06);
      render();
    }

    let activeCamStream = null;
    let activeScanTimer = null;

    function stopCameraScanner() {
      clearInterval(activeScanTimer);
      activeScanTimer = null;
      if (activeCamStream) {
        activeCamStream.getTracks().forEach(t => t.stop());
        activeCamStream = null;
      }
    }

    function handleScannedBarcode(code, mode = 'pos') {
      const clean = String(code || '').trim();
      if (!clean) return;
      const prod = state.products.find(p => p.barcode === clean);
      if (mode === 'inventory') {
        stopCameraScanner();
        closeModal();
        playBeep(1400, 0.08);
        if (prod) {
          openStockInModal(prod.id);
          showToast(`Đã đọc mã: ${prod.name}`);
        } else {
          openAddProductModal(clean);
          showToast(`Mã mới ${clean} — Nhập thông tin sản phẩm!`);
        }
        return;
      }
      if (prod) {
        addToCart(prod.id);
        showToast(`Đã thêm vào đơn: ${prod.name}`);
      } else {
        playBeep(450, 0.12);
        showToast(`Không tìm thấy SP có mã ${clean}`, 'warn');
      }
    }

    async function startCameraScanner(mode = 'pos') {
      const video = document.getElementById('cam-video');
      const statusEl = document.getElementById('cam-status');
      if (!video || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (statusEl) statusEl.textContent = 'Trình duyệt không hỗ trợ Camera trực tiếp — Dùng máy quét USB/Bluetooth hoặc nhập mã bên dưới.';
        return;
      }
      try {
        activeCamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = activeCamStream;
        await video.play();
        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'code_128', 'qr_code'] });
          if (statusEl) statusEl.textContent = 'Đưa mã vạch vào khung đỏ để tự động quét...';
          let lastCode = '';
          let lastAt = 0;
          activeScanTimer = setInterval(async () => {
            try {
              const codes = await detector.detect(video);
              if (codes && codes.length > 0) {
                const raw = codes[0].rawValue;
                const now = Date.now();
                if (raw && (raw !== lastCode || now - lastAt > 1800)) {
                  lastCode = raw;
                  lastAt = now;
                  handleScannedBarcode(raw, mode);
                }
              }
            } catch (e) {}
          }, 350);
        } else {
          if (statusEl) statusEl.textContent = 'Camera đã bật (Thiết bị chưa hỗ trợ BarcodeDetector — Hãy dùng máy quét hoặc nhập mã thủ công).';
        }
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Chưa cấp quyền Camera — Dùng máy quét USB/Bluetooth hoặc chạm mã mẫu bên dưới.';
      }
    }

    function updateChangeDisplay(total) {
      const val = Number(document.getElementById('cash-input')?.value || 0);
      const disp = document.getElementById('change-display');
      if (disp) disp.textContent = fmt(Math.max(0, val - total));
    }

    function updateCartQty(idx, delta, method) {
      const item = state.cart[idx];
      if (!item) return;
      const prod = state.products.find(p => p.id === item.id);
      const next = item.qty + delta;
      if (next <= 0) state.cart.splice(idx, 1);
      else if (prod && next > prod.stock) { showToast(`Kho chỉ còn ${prod.stock}`, 'warn'); return; }
      else item.qty = next;
      render();
      openCartModal(method);
    }

    function holdCurrentBill() {
      const cust = state.customers.find(c => c.id === state.selectedCustomerId);
      const now = new Date();
      const time = now.toTimeString().slice(0, 5);
      state.heldBills.push({
        time,
        customerId: state.selectedCustomerId,
        customerName: cust ? cust.name : 'Khách lẻ',
        cart: JSON.parse(JSON.stringify(state.cart))
      });
      state.cart = [];
      state.selectedCustomerId = null;
      state.checkoutGuest = { phone: '', name: '', cccd: '' };
      state.promoCode = '';
      state.usePoints = false;
      state.customDiscount = 0;
      closeModal();
      render();
      showToast('Đã treo đơn hàng tạm thời!');
    }

    function onCheckoutCustomerField(field, val, method) {
      if (!state.checkoutGuest) state.checkoutGuest = { phone: '', name: '', cccd: '' };
      const clean = (val || '').trim();
      state.checkoutGuest[field] = clean;

      if (field === 'phone' || field === 'cccd') {
        const found = state.customers.find(c =>
          (field === 'phone' && clean.length >= 9 && c.phone === clean) ||
          (field === 'cccd' && clean.length >= 9 && c.cccd && c.cccd === clean)
        );
        if (found) {
          state.selectedCustomerId = found.id;
          state.checkoutGuest = { phone: found.phone, name: found.name, cccd: found.cccd || '' };
          const nameEl = document.getElementById('chk-name');
          const phoneEl = document.getElementById('chk-phone');
          const cccdEl = document.getElementById('chk-cccd');
          if (nameEl) nameEl.value = found.name;
          if (phoneEl && field !== 'phone') phoneEl.value = found.phone;
          if (cccdEl && field !== 'cccd') cccdEl.value = found.cccd || '';
          showToast(`Khách hàng cũ: ${found.name} (${found.points} điểm)`);
        } else if (state.selectedCustomerId) {
          const cur = state.customers.find(c => c.id === state.selectedCustomerId);
          if (cur && ((field === 'phone' && cur.phone !== clean) || (field === 'cccd' && (cur.cccd || '') !== clean))) {
            state.selectedCustomerId = null;
          }
        }
      }
    }

    function completeCheckout(method) {
      if (!state.cart || state.cart.length === 0) { showToast('Giỏ hàng đang trống!', 'warn'); return; }
      const { subtotal, promoDiscount, pointsUsed, pointsDiscount, total, pointsEarned, customer, appliedPromo, eligibleCustomPromos, extraCustom } = calcCartTotals();
      state.cart.forEach(ci => {
        const p = state.products.find(pr => pr.id === ci.id);
        if (p) p.stock = Math.max(0, p.stock - ci.qty);
      });
      let activeCust = customer;
      const gPhone = (state.checkoutGuest && state.checkoutGuest.phone || '').trim();
      const gName = (state.checkoutGuest && state.checkoutGuest.name || '').trim();
      const gCccd = (state.checkoutGuest && state.checkoutGuest.cccd || '').trim();
      if (!activeCust && (gPhone || gCccd || gName)) {
        activeCust = state.customers.find(c => (gPhone && c.phone === gPhone) || (gCccd && c.cccd && c.cccd === gCccd)) || null;
        if (activeCust) {
          if (gName && !activeCust.name) activeCust.name = gName;
          if (gCccd && !activeCust.cccd) activeCust.cccd = gCccd;
        } else {
          activeCust = {
            id: 'C' + Date.now(),
            name: gName || ('Khách ' + (gPhone || gCccd)),
            phone: gPhone,
            cccd: gCccd,
            tier: 'Thành viên',
            points: 0,
            totalSpent: 0,
            visits: 0,
            birthday: '',
            lastVisit: getTodayStr(),
            note: 'Tự động tạo hội viên khi thanh toán',
            cared: false
          };
          state.customers.unshift(activeCust);
        }
      }
      if (activeCust) {
        activeCust.points = Math.max(0, activeCust.points - pointsUsed) + pointsEarned;
        activeCust.totalSpent += total;
        activeCust.visits += 1;
        activeCust.lastVisit = getTodayStr();
        recalcCustomerTier(activeCust);
      }

      const now = new Date();
      const time = now.toTimeString().slice(0, 5);
      const raffleTickets = [];
      (eligibleCustomPromos || []).forEach(pr => {
        if (!pr.raffleEnabled) return;
        const limit = Number(pr.raffleLimit || 0);
        let issued = Number(pr.raffleIssued || 0);
        const countToIssue = (pr.raffleMulti !== false && (pr.minOrder || 0) > 0)
          ? Math.max(1, Math.floor(total / pr.minOrder))
          : 1;
        for (let k = 0; k < countToIssue; k++) {
          if (limit > 0 && issued < limit) {
            issued += 1;
            pr.raffleIssued = issued;
            raffleTickets.push({
              code: String(issued).padStart(5, '0'),
              limitStr: String(limit).padStart(5, '0'),
              promoCode: pr.code,
              promoName: pr.name,
              promoRule: pr.customRule || pr.name,
              drawTime: pr.drawTime || ''
            });
          }
        }
      });
      const raffleCode = raffleTickets.length ? raffleTickets.map(t => t.code).join(', ') : '';
      const raffleLimitStr = raffleTickets.length ? raffleTickets[0].limitStr : '';

      const orderId = `HD-261115-${String(state.orders.length + 1).padStart(2, '0')}`;
      const newOrder = {
        id: orderId,
        isoDate: getTodayStr(),
        date: getTodayStr().split('-').reverse().join('/'),
        time,
        branch: state.shift.branch,
        cashier: state.shift.cashier,
        customerId: activeCust ? activeCust.id : null,
        customerName: activeCust ? activeCust.name : 'Khách lẻ',
        items: JSON.parse(JSON.stringify(state.cart)),
        subtotal,
        promoCode: appliedPromo ? appliedPromo.code : '',
        promoName: appliedPromo ? (appliedPromo.customRule ? `${appliedPromo.name} (${appliedPromo.customRule})` : appliedPromo.name) : (extraCustom > 0 ? 'Giảm giá tự do tại quầy' : ''),
        raffleCode,
        raffleLimitStr,
        raffleTickets,
        discount: promoDiscount + pointsDiscount,
        pointsUsed,
        total,
        pointsEarned,
        method,
        status: 'Hoàn thành'
      };
      state.orders.unshift(newOrder);
      const exportQty = state.cart.reduce((s, i) => s + i.qty, 0);
      const exportCost = state.cart.reduce((s, i) => s + (i.cost || i.price * 0.8) * i.qty, 0);
      state.stockLogs.unshift({ id: 'SL' + Date.now(), isoDate: getTodayStr(), time, type: 'export', prodName: `Xuất bán ${orderId}`, qty: exportQty, totalCost: exportCost });

      if (promoDiscount > 0) {
        state.auditLogs.unshift({
          id: 'AL' + Date.now(),
          time,
          branch: state.shift.branch,
          staff: state.shift.cashier,
          action: `Áp dụng ${appliedPromo ? appliedPromo.code : 'Giảm giá quầy'}`,
          detail: `Giảm ${fmt(promoDiscount)} cho ${orderId}`,
          level: 'warn'
        });
      }

      state.cart = [];
      state.selectedCustomerId = null;
      state.promoCode = '';
      state.usePoints = false;
      state.customDiscount = 0;
      if (method === 'Tiền mặt') playDrawerLatchSound(); else playSuccessBeep();
      render();
      showToast(`✓ Thanh toán thành công • ${orderId} (${fmt(total)})`);
      openReceiptModal(newOrder);
    }

            </div>

              if (!tickets.length) return '';
              return `

                  </div>

    function redeemGift(custId, giftId) {
      const cust = state.customers.find(c => c.id === custId);
      const gift = state.gifts.find(g => g.id === giftId);
      if (!cust || !gift || cust.points < gift.pointsCost || gift.stock <= 0) return;
      cust.points -= gift.pointsCost;
      gift.stock -= 1;
      const time = new Date().toTimeString().slice(0, 5);
      state.redemptions.unshift({ customerName: cust.name, giftName: gift.name, points: gift.pointsCost, time });
      playBeep(1500, 0.1);
      render();
      showToast(`Đổi thành công "${gift.name}" cho ${cust.name}!`);
    }

    let tempProductImage = '';

    function handleProductPhotoCapture(input, previewId) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const maxSide = 160;
          let w = img.width, h = img.height;
          if (w > h && w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; }
          else if (h >= w && h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          tempProductImage = canvas.toDataURL('image/jpeg', 0.78);
          const prev = document.getElementById(previewId);
          if (prev) { prev.src = tempProductImage; prev.classList.remove('hidden'); }
          showToast('Đã chụp/tải ảnh sản phẩm!');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

      if (state.ownerChartMode === 'hourly') {
        labels = ['08h', '09h', '10h', '11h', '12h', '13h', '14h', '16h', '18h', '20h'];
        const vals = labels.map(h => filteredOrders.filter(o => o.time.startsWith(h.slice(0, 2))).reduce((s, o) => s + o.total, 0));
        datasets = [{ label: 'Doanh thu (đ)', data: vals, backgroundColor: '#10b981', borderRadius: 6 }];
      } else if (state.ownerChartMode === 'daily') {
        const dayMap = {};
        filteredOrders.forEach(o => {
          const d = o.isoDate || getTodayStr();
          dayMap[d] = (dayMap[d] || 0) + o.total;
        });
        const sortedDays = Object.keys(dayMap).sort();
        labels = sortedDays.length ? sortedDays.map(d => d.slice(8) + '/' + d.slice(5, 7)) : [getTodayStr().slice(8) + '/' + getTodayStr().slice(5, 7)];
        const vals = sortedDays.length ? sortedDays.map(d => dayMap[d]) : [0];
        datasets = [{ label: 'Doanh thu ngày (đ)', data: vals, backgroundColor: '#059669', borderRadius: 6 }];
      } else if (state.ownerChartMode === 'monthly') {
        const mMap = {};
        allBranchOrders.forEach(o => {
          const m = (o.isoDate || getTodayStr()).slice(0, 7);
          mMap[m] = (mMap[m] || 0) + o.total;
        });
        const sortedM = Object.keys(mMap).sort();
        labels = sortedM.length ? sortedM.map(m => 'T' + m.slice(5) + '/' + m.slice(2, 4)) : ['T11/26'];
        const vals = sortedM.length ? sortedM.map(m => mMap[m]) : [0];
        datasets = [{ label: 'Doanh thu tháng (đ)', data: vals, backgroundColor: '#0d9488', borderRadius: 6 }];
      } else {
        // Stock Import vs Export by day
        const sMap = {};
        filteredLogs.forEach(l => {
          if (!sMap[l.isoDate]) sMap[l.isoDate] = { imp: 0, exp: 0 };
          if (l.type === 'import') sMap[l.isoDate].imp += (l.totalCost || 0);
          else sMap[l.isoDate].exp += (l.totalCost || 0);
        });
        const days = Object.keys(sMap).sort();
        labels = days.length ? days.map(d => d.slice(8) + '/' + d.slice(5, 7)) : ['Hôm nay'];
        datasets = [
          { label: 'Nhập kho (đ)', data: days.length ? days.map(d => sMap[d].imp) : [0], backgroundColor: '#2563eb', borderRadius: 6 },
          { label: 'Xuất kho (đ)', data: days.length ? days.map(d => sMap[d].exp) : [0], backgroundColor: '#f59e0b', borderRadius: 6 }
        ];
      }

      const ctx = document.getElementById('owner-revenue-chart').getContext('2d');
      if (ownerChartInstance) ownerChartInstance.destroy();
      if (typeof Chart === 'undefined') {
        const box = document.getElementById('owner-revenue-chart').parentElement;
        const flat = datasets[0].data || [0];
        const maxVal = Math.max(1, ...flat);
        box.innerHTML = `<div class="h-full flex items-end justify-between gap-2 pt-4 pb-1 px-1">` +
          labels.map((lb, i) => `<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">
            <div class="w-full bg-emerald-500 rounded-t" style="height:${Math.max(4, Math.round((flat[i]/maxVal)*100))}%"></div>
            <span class="text-[10px] text-slate-500 truncate">${lb}</span>
          </div>`).join('') + `</div>`;
        return;
      }
      ownerChartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: datasets.length > 1, labels: { font: { size: 10 } } } },
          scales: {
            y: { beginAtZero: true, ticks: { font: { size: 10 }, callback: (v) => (v >= 1000000 ? (v / 1000000).toFixed(1) + 'tr' : v >= 1000 ? (v / 1000) + 'k' : v) } },
            x: { ticks: { font: { size: 10 } } }
          }
        }
      });

    function removeOwnerCategory(idx) {
      if (state.categories.length <= 1) { showToast('Cần giữ lại ít nhất 1 danh mục', 'warn'); return; }

      state.categories.splice(idx, 1);
      const removedIds = new Set(state.products.filter(p => p.category === removed).map(p => p.id));
      state.products = state.products.filter(p => p.category !== removed);
      state.cart = state.cart.filter(c => !removedIds.has(c.id));
      if (state.posCategory === removed) state.posCategory = 'Tất cả';

      openCategoryManagerModal();
      showToast(`Đã xóa danh mục "${removed}" và ${removedIds.size} sản phẩm thuộc nhóm này!`);

    function updatePromoImagePreview(src) {
      tempPromoImage = src || '';
      const prev = document.getElementById('pr-img-preview');
      const clr = document.getElementById('pr-img-clear');
      if (prev) {
        prev.src = tempPromoImage;
        prev.classList.toggle('hidden', !tempPromoImage);
      }
      if (clr) clr.classList.toggle('hidden', !tempPromoImage);
    }

    function handlePromoImageUpload(input) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onerror = function() {
        showToast('Không đọc được ảnh này, thử ảnh khác hoặc dán link ảnh', 'error');
      };
      reader.onload = function(ev) {
        const img = new Image();
        img.onerror = function() {
          updatePromoImagePreview(ev.target.result);
        };
        img.onload = function() {
          const maxSide = 160;
          let w = img.width, h = img.height;
          if (w > h && w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; }
          else if (h >= w && h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          updatePromoImagePreview(canvas.toDataURL('image/jpeg', 0.78));
          showToast('Đã tải ảnh khuyến mãi!');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

          </div>

                    <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200 space-y-1.5">
            <div class="text-[11px] font-bold text-amber-900">🏆 Chủ shop cài đặt mốc điểm lên Hạng thành viên:</div>

              <div>
                <label class="text-[10px] text-slate-600 block">Bạc từ (đ)</label>

              </div>
              <div>
                <label class="text-[10px] text-slate-600 block">Vàng từ (đ)</label>
                <input id="th-gold" type="number" value="${(state.tierThresholds && state.tierThresholds.gold) || 500}" class="w-full px-2 py-1 bg-white border border-amber-300 rounded-lg text-xs font-bold" />
              </div>
              <div>
                <label class="text-[10px] text-slate-600 block">Kim Cương từ</label>
                <input id="th-diamond" type="number" value="${(state.tierThresholds && state.tierThresholds.diamond) || 1200}" class="w-full px-2 py-1 bg-white border border-amber-300 rounded-lg text-xs font-bold" />
              </div>
            </div>
            <button type="button" onclick="saveTierThresholds()" class="w-full py-1.5 bg-amber-500 text-white rounded-lg text-[11px] font-bold">Cập nhật Hạng mức Thành viên</button>
          </div>

          <div class="space-y-2 max-h-60 overflow-y-auto">
            ${state.promos.map((pr, idx) => {
              const st = getPromoStatus(pr);
              const dateTxt = (pr.startDate || pr.endDate) ? `${pr.startDate || '...'} → ${pr.endDate || 'Không giới hạn'}` : 'Không giới hạn ngày';
              const memCondTxt = pr.memberMode === 'top_race' ? `Đua Top ${pr.memberTopN || 3}` : `≥${pr.memberMinPts || 0}đ`;
              const memRewardTxt = pr.memberDiscType === 'fixed' ? fmt(pr.value) : pr.memberDiscType === 'voucher' ? `Phiếu mua hàng ${fmt(pr.value)}` : pr.memberDiscType === 'gift' ? `Quà: ${pr.memberGift || 'Quà tặng'}` : pr.memberDiscType === 'other' ? (pr.memberOther || 'Ưu đãi khác') : pr.value + '%';
              const prodObj = pr.type === 'product_promo' ? state.products.find(x => x.id === pr.targetProdId) : null;
              const prodTxt = prodObj ? `${prodObj.name} (${pr.prodDiscType === 'flat_price' ? 'Đồng giá ' + fmt(pr.value) : pr.prodDiscType === 'fixed' ? 'Giảm ' + fmt(pr.value) + '/SP' : 'Giảm ' + pr.value + '%'})` : fmt(pr.value);
              const valTxt = pr.type === 'percent' ? pr.value + '%' : pr.type === 'gift_points' ? '+' + pr.value + ' điểm' : pr.type === 'custom' ? (pr.customRule || 'Ưu đãi tự tạo') : pr.type === 'member_tier' ? (`Hạng ${pr.memberTier || 'Tất cả'} (${memCondTxt}): ${memRewardTxt}`) : pr.type === 'product_promo' ? prodTxt : fmt(pr.value);
              return `
                <div class="p-2.5 bg-white rounded-xl border border-slate-200 space-y-1.5">
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                      ${pr.image ? `<img src="${pr.image}" alt="${pr.code}" class="w-9 h-9 rounded-lg object-cover border border-slate-200 shrink-0" />` : `<span class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center text-sm shrink-0">🎁</span>`}
                      <span class="text-xs font-extrabold text-emerald-700">${pr.code}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold ${st.cls}">${st.label}</span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                      ${pr.type === 'member_tier' && pr.memberMode === 'top_race' ? `<button onclick="openTopRaceModal('${pr.id}')" class="px-2 py-1 bg-amber-100 text-amber-800 rounded-lg text-[10px] font-bold">🏆 BXH</button>` : ''}
                      <button onclick="editingPromoId='${pr.id}'; openPromoManagerModal();" class="px-2 py-1 bg-blue-50 text-blue-700 rounded-lg text-[10px] font-semibold">Sửa</button>
                      <button onclick="toggleOwnerPromo(${idx})" class="px-2 py-1 bg-slate-100 text-slate-700 rounded-lg text-[10px] font-semibold">${pr.active ? 'Tắt' : 'Bật'}</button>
                      <button onclick="deleteOwnerPromo(${idx})" class="px-2 py-1 bg-rose-50 text-rose-700 rounded-lg text-[10px] font-semibold">Xóa</button>
                    </div>
                  </div>
                  <div class="text-[11px] text-slate-700 font-medium">${pr.name} • <b>${valTxt}</b> (${pr.scope && pr.scope !== 'all' ? pr.scope : 'Toàn shop'})</div>
                  ${(pr.condMode === 'combo' || pr.condMode === 'both') && Array.isArray(pr.comboIds) && pr.comboIds.length ? `<div class="text-[10px] text-emerald-700 font-semibold">🧺 Combo: ${pr.comboIds.map(id => { const p = state.products.find(x => x.id === id); return p ? p.name : id; }).join(' + ')}</div>` : ''}
                  ${pr.raffleEnabled ? `<div class="text-[10px] text-amber-700 font-semibold">🎟️ Mã dự thưởng: Đã cấp ${pr.raffleIssued || 0}/${pr.raffleLimit || 200} (00001 - ${String(pr.raffleLimit || 200).padStart(5, '0')})${pr.drawTime ? ` • Quay số: ${pr.drawTime}` : ''}</div>` : ''}
                  <div class="text-[10px] text-slate-500">⏰ ${dateTxt}${pr.minOrder > 0 ? ` • Tổng HĐ từ ${fmt(pr.minOrder)}` : ''}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `);
    }

    function saveTierThresholds() {
      const silver = Math.max(1, Number(document.getElementById('th-silver')?.value || 200));
      const gold = Math.max(silver + 1, Number(document.getElementById('th-gold')?.value || 500));
      const diamond = Math.max(gold + 1, Number(document.getElementById('th-diamond')?.value || 1200));
      state.tierThresholds = { silver, gold, diamond };
      recalcAllCustomerTiers();
      render();
      openPromoManagerModal();
      showToast(`Đã cập nhật mốc hạng: Bạc ${silver}đ • Vàng ${gold}đ • Kim Cương ${diamond}đ`);
    }

    function onPromoTypeChange() {
      const t = document.getElementById('pr-type')?.value;
      const boxEl = document.getElementById('pr-custom-box');
      const memEl = document.getElementById('pr-member-box');
      const prodEl = document.getElementById('pr-product-box');
      if (prodEl) prodEl.classList.toggle('hidden', t !== 'product_promo');
      const valEl = document.getElementById('pr-val');
      const gridEl = document.getElementById('pr-val-min-grid');
      const minLbl = document.getElementById('pr-min-label');
      if (boxEl) boxEl.classList.toggle('hidden', t !== 'custom');
      if (memEl) memEl.classList.toggle('hidden', t !== 'member_tier');
      if (valEl) valEl.classList.toggle('hidden', t === 'custom');
      if (t === 'member_tier') onMemberDiscTypeChange();
      if (gridEl) {
        gridEl.classList.toggle('grid-cols-1', t === 'custom');
        gridEl.classList.toggle('grid-cols-2', t !== 'custom');
      }
      if (minLbl) minLbl.textContent = t === 'custom' ? 'Số tiền cần đạt trên hóa đơn (đ):' : 'Đơn tối thiểu (đ):';
    }

    function onMemberModeChange() {
      const m = document.getElementById('pr-mem-mode')?.value;
      const ptsW = document.getElementById('pr-mem-pts-wrap');
      const topW = document.getElementById('pr-mem-top-wrap');
      if (ptsW) ptsW.classList.toggle('hidden', m === 'top_race');
      if (topW) topW.classList.toggle('hidden', m !== 'top_race');
    }

    function onMemberDiscTypeChange() {
      const t = document.getElementById('pr-type')?.value;
      const dt = document.getElementById('pr-mem-dtype')?.value;
      const giftEl = document.getElementById('pr-mem-gift');
      const otherEl = document.getElementById('pr-mem-other');
      const valEl = document.getElementById('pr-val');
      if (giftEl) giftEl.classList.toggle('hidden', dt !== 'gift');
      if (otherEl) otherEl.classList.toggle('hidden', dt !== 'other');
      if (valEl && t === 'member_tier') {
        const hideVal = (dt === 'gift' || dt === 'other');
        valEl.classList.toggle('hidden', hideVal);
        if (dt === 'voucher') valEl.placeholder = 'Giá trị phiếu mua hàng (đ)';
        else if (dt === 'fixed') valEl.placeholder = 'Số tiền giảm (đ)';
        else valEl.placeholder = 'Mức giảm (%)';
      }
    }

    function onPromoCondModeChange() {
      const m = document.getElementById('pr-cond-mode')?.value;
      const picker = document.getElementById('pr-combo-picker');
      if (picker) picker.classList.toggle('hidden', m !== 'combo' && m !== 'both');
    }

    function saveOwnerPromo() {
      const name = (document.getElementById('pr-name')?.value || '').trim();
      let code = (document.getElementById('pr-code')?.value || '').trim().toUpperCase();
      const type = document.getElementById('pr-type')?.value || 'percent';
      const customRule = (document.getElementById('pr-custom-rule')?.value || '').trim();
      const condMode = type === 'custom' ? (document.getElementById('pr-cond-mode')?.value || 'order_total') : 'order_total';
      const comboIds = type === 'custom' && (condMode === 'combo' || condMode === 'both')
        ? Array.from(document.querySelectorAll('.pr-combo-chk:checked')).map(el => el.value)
        : [];
      const raffleEnabled = type === 'custom' && Boolean(document.getElementById('pr-raffle-enable')?.checked);
      const raffleLimit = raffleEnabled ? Math.max(1, Number(document.getElementById('pr-raffle-limit')?.value || 200)) : 0;
      const raffleMulti = raffleEnabled && Boolean(document.getElementById('pr-raffle-multi')?.checked);

      const drawTime = raffleEnabled ? (document.getElementById('pr-raffle-draw-time')?.value || '').trim() : '';
      const memberTier = type === 'member_tier' ? (document.getElementById('pr-mem-tier')?.value || 'Tất cả') : 'Tất cả';
      const memberMode = type === 'member_tier' ? (document.getElementById('pr-mem-mode')?.value || 'min_pts') : 'min_pts';
      const memberMinPts = type === 'member_tier' ? Math.max(0, Number(document.getElementById('pr-mem-pts')?.value || 0)) : 0;
      const memberTopN = type === 'member_tier' ? Math.max(1, Number(document.getElementById('pr-mem-topn')?.value || 3)) : 3;
      const memberDiscType = type === 'member_tier' ? (document.getElementById('pr-mem-dtype')?.value || 'percent') : 'percent';
      const memberGift = type === 'member_tier' ? (document.getElementById('pr-mem-gift')?.value || '').trim() : '';
      const memberOther = type === 'member_tier' ? (document.getElementById('pr-mem-other')?.value || '').trim() : '';
      const targetProdId = type === 'product_promo' ? (document.getElementById('pr-target-prod')?.value || '') : '';
      const prodDiscType = type === 'product_promo' ? (document.getElementById('pr-prod-dtype')?.value || 'percent') : 'percent';

      const noNumericVal = type === 'custom' || (type === 'member_tier' && (memberDiscType === 'gift' || memberDiscType === 'other'));
      const value = noNumericVal ? 0 : Number(document.getElementById('pr-val')?.value || 0);
      const minOrder = Math.max(0, Number(document.getElementById('pr-min')?.value || 0));
      const scope = document.getElementById('pr-scope')?.value || 'all';
      const startDate = document.getElementById('pr-start')?.value || '';
      const endDate = document.getElementById('pr-end')?.value || '';
      if (!editingPromoId) {
        state.promoSeq = (state.promoSeq || 0) + 1;
        if (!code || /^MN\d{6}$/.test(code)) code = generateAutoPromoCode(startDate, state.promoSeq);
      } else if (!code) {
        code = generateAutoPromoCode(startDate, state.promoSeq || 1);
      }
      if (type === 'custom' && !customRule && !name) { showToast('Vui lòng nhập tên hoặc nội dung ưu đãi tự tạo', 'warn'); return; }
      if (type === 'member_tier' && memberDiscType === 'gift' && !memberGift) { showToast('Vui lòng nhập tên quà tặng', 'warn'); return; }
      if (type === 'member_tier' && memberDiscType === 'other' && !memberOther) { showToast('Vui lòng nhập nội dung ưu đãi khác', 'warn'); return; }
      if (!noNumericVal && value <= 0) { showToast('Nhập mức giảm / giá trị phiếu / điểm tặng hợp lệ', 'warn'); return; }
      if (startDate && endDate && endDate < startDate) { showToast('Ngày kết thúc phải sau ngày bắt đầu', 'warn'); return; }

      if (editingPromoId) {
        const pr = state.promos.find(p => p.id === editingPromoId);
        if (pr) {
          pr.name = name || `Ưu đãi ${code}`;
          pr.code = code; pr.type = type; pr.value = value; pr.minOrder = minOrder;
          pr.scope = scope; pr.startDate = startDate; pr.endDate = endDate; pr.image = tempPromoImage; pr.customRule = customRule; pr.condMode = condMode; pr.comboIds = comboIds; pr.raffleEnabled = raffleEnabled; pr.raffleLimit = raffleLimit; pr.raffleMulti = raffleMulti; pr.drawTime = drawTime; pr.memberTier = memberTier; pr.memberMode = memberMode; pr.memberMinPts = memberMinPts; pr.memberTopN = memberTopN; pr.memberDiscType = memberDiscType; pr.memberGift = memberGift; pr.memberOther = memberOther; pr.targetProdId = targetProdId; pr.prodDiscType = prodDiscType;
          if (type === 'member_tier') notifyZaloForMemberPromo(pr); if (typeof pr.raffleIssued !== 'number') pr.raffleIssued = 0;
        }
        editingPromoId = null;
        tempPromoImage = '';
        showToast(`Đã cập nhật chương trình ${code}!`);
      } else {
        const newPr = { id: 'PR' + Date.now(), code, name: name || customRule || `Ưu đãi ${code}`, type, customRule, condMode, comboIds, raffleEnabled, raffleLimit, raffleMulti, drawTime, raffleIssued: 0, memberTier, memberMode, memberMinPts, memberTopN, memberDiscType, memberGift, memberOther, targetProdId, prodDiscType, value, minOrder, scope, startDate, endDate, image: tempPromoImage, active: true };
        state.promos.unshift(newPr);
        if (type === 'member_tier') notifyZaloForMemberPromo(newPr);
        tempPromoImage = '';
        showToast(`Đã tạo chương trình ${code}!`);
      }
      render();
      openPromoManagerModal();
    }

    function toggleOwnerPromo(idx) {
      if (!state.promos[idx]) return;
      state.promos[idx].active = !state.promos[idx].active;
      render();
      openPromoManagerModal();
    }

    function deleteOwnerPromo(idx) {
      if (state.promos[idx] && state.promos[idx].id === editingPromoId) editingPromoId = null;
      state.promos.splice(idx, 1);
      render();
      openPromoManagerModal();
      showToast('Đã xóa chương trình khuyến mãi');
    }

    // ==========================================
    // 3C. EAN-13 BARCODE GENERATOR & LABEL MODAL
    // ==========================================
    function generateValidEAN13() {
      let base = '893' + String(Math.floor(100000000 + Math.random() * 899999999));
      base = base.slice(0, 12);
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        sum += Number(base[i]) * (i % 2 === 0 ? 1 : 3);
      }
      const check = (10 - (sum % 10)) % 10;
      return base + String(check);
    }

    function encodeEAN13Bits(code) {
      const clean = String(code || '').replace(/\D/g, '').padEnd(13, '0').slice(0, 13);
      const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
      const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
      const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
      const PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
      const first = Number(clean[0]);
      const pat = PARITY[first] || PARITY[0];
      let bits = '101';
      for (let i = 1; i <= 6; i++) {
        const d = Number(clean[i]);
        bits += pat[i - 1] === 'L' ? L[d] : G[d];
      }
      bits += '01010';
      for (let i = 7; i <= 12; i++) {
        bits += R[Number(clean[i])];
      }
      bits += '101';
      return { clean, bits };
    }

    function renderEAN13Svg(code) {
      const { clean, bits } = encodeEAN13Bits(code);
      const bw = 2;
      const w = bits.length * bw + 20;
      let rects = '';
      for (let i = 0; i < bits.length; i++) {
        if (bits[i] === '1') {
          const isGuard = i < 3 || (i >= 45 && i < 50) || i >= 92;
          rects += `<rect x="${10 + i * bw}" y="6" width="${bw}" height="${isGuard ? 66 : 56}" fill="#0f172a"/>`;
        }
      }
      return `
        <svg viewBox="0 0 ${w} 86" class="w-full max-w-sm mx-auto" style="height:86px;background:#fff;">
          ${rects}
          <text x="${w / 2}" y="82" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">${clean}</text>
        </svg>
      `;
    }

                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `);
    }

    function addOwnerBranch() {
      const val = (document.getElementById('new-branch-inp')?.value || '').trim();
      if (!val) { showToast('Vui lòng nhập tên chi nhánh', 'warn'); return; }
      if (state.branches.includes(val)) { showToast('Chi nhánh này đã tồn tại', 'warn'); return; }
      state.branches.push(val);
      render();
      openBranchManagerModal();
      showToast(`Đã thêm chi nhánh "${val}"!`);
    }

    function setActiveBranch(idx) {
      const b = state.branches[idx];
      if (!b) return;
      state.shift.branch = b;
      if (state.storeInfo) state.storeInfo.branch = b;
      render();
      openBranchManagerModal();
      showToast(`Đã chuyển quầy sang ${b}`);
    }

    function removeOwnerBranch(idx) {
      if (state.branches.length <= 1) { showToast('Cần giữ lại ít nhất 1 chi nhánh', 'warn'); return; }
      const removed = state.branches[idx];
      state.branches.splice(idx, 1);
      if (state.shift.branch === removed) state.shift.branch = state.branches[0];
      if (state.ownerBranch === removed) state.ownerBranch = 'Tất cả chi nhánh';
      render();
      openBranchManagerModal();
      showToast(`Đã xóa chi nhánh "${removed}"`);
    }

    function openWeeklyScheduleModal() {
      const staffOpts = (selected) => {
        return `<option value="">-- Nghỉ / Trống --</option>` +
          state.staffList.map(st => `<option value="${st.name}" ${selected === st.name ? 'selected' : ''}>${st.name} (${st.role})</option>`).join('');
      };
      openModal(`
        <div class="p-4 space-y-3 overflow-y-auto max-h-[88vh]">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm text-slate-900">Xếp Lịch trực & Ca trực Hàng tuần</h3>
            <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
          </div>
          <div class="bg-blue-50 border border-blue-200 p-2.5 rounded-xl text-[11px] text-blue-900 flex items-center justify-between gap-2">
            <span>Phân ca cho ${state.staffList.length} nhân viên từ Thứ 2 đến Chủ nhật.</span>
            <button onclick="applyTodaySchedule()" class="px-2.5 py-1 bg-blue-600 text-white rounded-lg text-[10px] font-bold shrink-0">Áp ca hôm nay</button>
          </div>
          <div class="space-y-2 max-h-80 overflow-y-auto">
            ${WEEK_DAYS.map((day, dIdx) => {
              const row = (state.weeklySchedule && state.weeklySchedule[day]) || { sang: '', chieu: '', dem: '' };
              return `
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 space-y-1.5">
                  <div class="text-xs font-extrabold text-slate-800">${day}</div>
                  <div class="grid grid-cols-3 gap-1.5">
                    <div>
                      <label class="text-[10px] text-slate-500 block">Ca Sáng (6-14h)</label>
                      <select id="ws-${dIdx}-sang" class="w-full px-1.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold">${staffOpts(row.sang)}</select>
                    </div>
                    <div>
                      <label class="text-[10px] text-slate-500 block">Ca Chiều (14-22h)</label>
                      <select id="ws-${dIdx}-chieu" class="w-full px-1.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold">${staffOpts(row.chieu)}</select>
                    </div>
                    <div>
                      <label class="text-[10px] text-slate-500 block">Ca Đêm (22-6h)</label>
                      <select id="ws-${dIdx}-dem" class="w-full px-1.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold">${staffOpts(row.dem)}</select>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <button onclick="saveWeeklySchedule()" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Lưu Lịch trực tuần</button>
        </div>
      `);
    }

    function saveWeeklySchedule() {
      const next = {};
      WEEK_DAYS.forEach((day, dIdx) => {
        next[day] = {
          sang: document.getElementById(`ws-${dIdx}-sang`)?.value || '',
          chieu: document.getElementById(`ws-${dIdx}-chieu`)?.value || '',
          dem: document.getElementById(`ws-${dIdx}-dem`)?.value || ''
        };
      });
      state.weeklySchedule = next;
      closeModal();
      render();
      showToast('Đã lưu lịch trực tuần cho nhân viên!');
    }

    function applyTodaySchedule() {
      const jsDay = new Date().getDay(); // 0=CN, 1=T2..6=T7
      const mapDay = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
      const todayName = mapDay[jsDay];
      const h = new Date().getHours();
      const shiftKey = (h >= 6 && h < 14) ? 'sang' : (h >= 14 && h < 22) ? 'chieu' : 'dem';
      const shiftLbl = shiftKey === 'sang' ? 'Ca Sáng' : shiftKey === 'chieu' ? 'Ca Chiều' : 'Ca Đêm';
      const assigned = state.weeklySchedule && state.weeklySchedule[todayName] && state.weeklySchedule[todayName][shiftKey];
      if (!assigned) {
        showToast(`${todayName} (${shiftLbl}) chưa xếp nhân viên trực`, 'warn');
        return;
      }
      state.shift.cashier = assigned;
      render();
      openWeeklyScheduleModal();
      showToast(`Đã áp dụng lịch ${todayName} (${shiftLbl}): Thu ngân ${assigned}`);
    }

    // ==========================================
    // 4. GLOBAL NAVIGATION & INIT
    // ==========================================
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('btn-role-switch').addEventListener('click', () => {
      state.activeTab = state.activeTab === 'owner' ? 'pos' : 'owner';
      render();
    });

    let hwScanBuffer = '';
    let hwScanLastTime = 0;
    document.addEventListener('keydown', (e) => {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      const now = Date.now();
      if (now - hwScanLastTime > 120) hwScanBuffer = '';
      hwScanLastTime = now;
      if (e.key === 'Enter' && hwScanBuffer.length >= 6) {
        const code = hwScanBuffer;
        hwScanBuffer = '';
        if (state.activeTab === 'inventory') handleScannedBarcode(code, 'inventory');
        else handleScannedBarcode(code, 'pos');
      } else if (/^[0-9a-zA-Z]$/.test(e.key)) {
        hwScanBuffer += e.key;
      }
    });

    window.addEventListener('DOMContentLoaded', () => { render(true); startCloudPolling(); if (cloudConfig.enabled) pullFromCloud(true); });
  </script>
</body>
</html>

<body class="bg-slate-100 text-slate-900 min-h-screen">

    // ==========================================
    // 1. INITIAL DATA & STATE MANAGEMENT
    // ==========================================
    const STORAGE_KEY = 'smartmart_pos_v2';
    const CLOUD_CFG_KEY = 'smartmart_cloud_cfg_v1';

    function loadCloudConfig() {
      try {
        const raw = localStorage.getItem(CLOUD_CFG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { enabled: false, url: '', storeId: 'SMARTMART-01', lastSync: '' };
    }

    let cloudConfig = loadCloudConfig();
    let cloudPushTimer = null;
    let cloudPollTimer = null;

    function saveCloudConfig() {
      try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudConfig)); } catch (e) {}
    }

    function getCloudEndpoint() {
      const base = (cloudConfig.url || '').trim().replace(/\/+$/, '');
      const store = (cloudConfig.storeId || 'SMARTMART-01').trim().replace(/[^a-zA-Z0-9_-]/g, '');
      if (!base.startsWith('https://')) return '';
      return `${base}/smartmart_stores/${store}.json`;
    }

    function getSharedPayload() {
      return {
        categories: state.categories,
        promos: state.promos,
        products: state.products,
        customers: state.customers,
        gifts: state.gifts,
        orders: state.orders,
        heldBills: state.heldBills,
        shift: state.shift,
        redemptions: state.redemptions,
        careLogs: state.careLogs,
        auditLogs: state.auditLogs,
        updatedAt: Date.now()
      };
    }

    function applySharedPayload(data) {
      if (!data || typeof data !== 'object') return false;
      if (Array.isArray(data.categories)) state.categories = data.categories;
      if (Array.isArray(data.promos)) state.promos = data.promos;
      if (Array.isArray(data.products)) state.products = data.products;
      if (Array.isArray(data.customers)) state.customers = data.customers;
      if (Array.isArray(data.gifts)) state.gifts = data.gifts;
      if (Array.isArray(data.orders)) state.orders = data.orders;
      if (Array.isArray(data.heldBills)) state.heldBills = data.heldBills;
      if (data.shift && typeof data.shift === 'object') state.shift = data.shift;
      if (Array.isArray(data.redemptions)) state.redemptions = data.redemptions;
      if (Array.isArray(data.careLogs)) state.careLogs = data.careLogs;
      if (Array.isArray(data.auditLogs)) state.auditLogs = data.auditLogs;
      return true;
    }

    async function pushToCloud(silent = true) {
      const endpoint = getCloudEndpoint();
      if (!cloudConfig.enabled || !endpoint) return false;
      try {
        const res = await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(getSharedPayload())
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        cloudConfig.lastSync = new Date().toTimeString().slice(0, 8);
        saveCloudConfig();
        updateSyncBadge();
        if (!silent) showToast('Đã đẩy dữ liệu lên đám mây!');
        return true;
      } catch (err) {
        if (!silent) showToast('Lỗi đẩy dữ liệu Cloud: kiểm tra URL & Rules Firebase', 'error');
        return false;
      }
    }

    async function pullFromCloud(silent = true) {
      const endpoint = getCloudEndpoint();
      if (!cloudConfig.enabled || !endpoint) return false;
      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && applySharedPayload(data)) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          cloudConfig.lastSync = new Date().toTimeString().slice(0, 8);
          saveCloudConfig();
          render(true);
          if (!silent) showToast('Đã tải dữ liệu mới nhất từ đám mây!');
          return true;
        } else {
          if (!silent) {
            await pushToCloud(true);
            showToast('Kho dữ liệu mới trên Cloud — đã khởi tạo dữ liệu cửa hàng!');
          }
          return true;
        }
      } catch (err) {
        if (!silent) showToast('Không thể kết nối Firebase. Kiểm tra lại URL https://...', 'error');
        return false;
      }
    }

    function scheduleCloudPush() {
      if (!cloudConfig.enabled) return;
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(() => pushToCloud(true), 600);
    }

    function startCloudPolling() {
      clearInterval(cloudPollTimer);
      if (cloudConfig.enabled && getCloudEndpoint()) {
        cloudPollTimer = setInterval(() => pullFromCloud(true), 6000);
      }
    }

    function updateSyncBadge() {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      if (!dot || !label) return;
      if (cloudConfig.enabled && getCloudEndpoint()) {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-lime-400 live-dot';
        label.textContent = 'Cloud Live';
      } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-300';
        label.textContent = 'Offline';
      }
    }

          </div>

            Trạng thái: <b>${isConn ? 'Đã kết nối Cloud (Đồng bộ tự động 6s/lần)' : 'Đang chạy Offline trên máy'}</b>
            ${cloudConfig.lastSync ? `<div class="text-[11px] opacity-80 mt-0.5">Đồng bộ lần cuối: ${cloudConfig.lastSync}</div>` : ''}
          </div>

          <div class="space-y-2">
            <div>
              <label class="text-[11px] font-bold text-slate-700 block mb-1">1. Đường dẫn Firebase Realtime Database (HTTPS)</label>
              <input id="cloud-url-input" type="url" value="${cloudConfig.url || ''}" placeholder="https://ten-du-an-default-rtdb.asia-southeast1.firebasedatabase.app"
                class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="connectCloudSync(false)" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold">Kết nối & Tải về</button>
            <button onclick="connectCloudSync(true)" class="py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold">Đẩy máy này lên</button>
          </div>
          ${isConn ? `
            <button onclick="disconnectCloudSync()" class="w-full py-2 bg-rose-50 text-rose-700 rounded-xl text-xs font-semibold">Ngắt kết nối (Về chế độ Offline)</button>
          ` : ''}

          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-600 space-y-1">
            <div class="font-bold text-slate-800">Hướng dẫn tạo Firebase miễn phí (2 phút):</div>
            <div>1. Vào <b>console.firebase.google.com</b> → Tạo dự án mới (Miễn phí).</div>
            <div>2. Chọn <b>Build → Realtime Database → Create Database</b> (chọn Singapore).</div>
            <div>3. Ở tab <b>Rules</b>, đổi <code>.read</code> và <code>.write</code> thành <code>true</code> (hoặc dùng trong nội bộ) rồi copy đường dẫn <code>https://...firebasedatabase.app</code> dán vào ô trên.</div>
          </div>

          <button onclick="resetDemoData()" class="w-full py-2 bg-slate-100 text-slate-600 rounded-xl text-[11px] font-semibold">Khôi phục dữ liệu mẫu ban đầu</button>
        </div>
      `);
    }

    async function connectCloudSync(pushFirst) {
      const url = (document.getElementById('cloud-url-input')?.value || '').trim();
      const storeId = (document.getElementById('cloud-store-input')?.value || 'SMARTMART-01').trim().toUpperCase();
      if (!url.startsWith('https://')) {
        showToast('Vui lòng nhập URL Firebase bắt đầu bằng https://', 'warn');
        return;
      }
      cloudConfig.url = url;
      cloudConfig.storeId = storeId || 'SMARTMART-01';
      cloudConfig.enabled = true;
      saveCloudConfig();
      const ok = pushFirst ? await pushToCloud(false) : await pullFromCloud(false);
      if (ok) {
        startCloudPolling();
        updateSyncBadge();
        closeModal();
        render(true);
      }
    }

    function disconnectCloudSync() {
      cloudConfig.enabled = false;
      saveCloudConfig();
      clearInterval(cloudPollTimer);
      updateSyncBadge();
      closeModal();
      render(true);
      showToast('Đã chuyển sang chế độ Offline trên máy');
    }

    const fmt = (n) => (Number(n) || 0).toLocaleString('vi-VN') + 'đ';

    function playBeep(freq = 1200, duration = 0.07) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration * 1000);
      } catch (e) {}
    }

    function showToast(msg, type = 'success') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-rose-600 text-white'
        : type === 'warn'
        ? 'bg-amber-500 text-white'
        : 'bg-slate-900 text-white';
      el.className = `${colors} text-xs font-medium px-3.5 py-2.5 rounded-xl shadow-lg flex items-center justify-between gap-2 transition-all duration-200`;
      el.innerHTML = `<span>${msg}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
      }, 2400);
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');

      root.classList.remove('hidden');

      document.getElementById('modal-root').classList.add('hidden');

    function getTierMultiplier(tier) {
      if (tier === 'Kim Cương') return 1.5;
      if (tier === 'Vàng') return 1.2;
      if (tier === 'Bạc') return 1.1;
      return 1.0;
    }

    function getTierBadge(tier) {
      const map = {
        'Kim Cương': 'bg-cyan-100 text-cyan-800 border-cyan-200',
        'Vàng': 'bg-amber-100 text-amber-800 border-amber-200',
        'Bạc': 'bg-slate-200 text-slate-700 border-slate-300',
        'Thành viên': 'bg-emerald-50 text-emerald-700 border-emerald-200'
      };
      return map[tier] || map['Thành viên'];
    }

    function calcCartTotals() {
      const subtotal = state.cart.reduce((s, item) => s + item.price * item.qty, 0);
      let promoDiscount = 0;
      const code = (state.promoCode || '').trim().toUpperCase();
      const matchedPromo = (state.promos || []).find(pr => pr.active && pr.code.toUpperCase() === code);
      if (matchedPromo && subtotal >= (matchedPromo.minOrder || 0)) {
        promoDiscount = matchedPromo.type === 'percent'
          ? Math.round(subtotal * (matchedPromo.value / 100))
          : Math.min(subtotal, matchedPromo.value);
      }

      const customer = state.customers.find(c => c.id === state.selectedCustomerId);
      let pointsUsed = 0;
      let pointsDiscount = 0;
      if (state.usePoints && customer && customer.points > 0) {
        const maxDiscount = Math.max(0, subtotal - promoDiscount);
        const maxPtsPossible = Math.floor(maxDiscount / 100);
        pointsUsed = Math.min(customer.points, maxPtsPossible);
        pointsDiscount = pointsUsed * 100;
      }

      const total = Math.max(0, subtotal - promoDiscount - pointsDiscount);
      const mult = customer ? getTierMultiplier(customer.tier) : 1;
      const pointsEarned = customer ? Math.floor((total / 10000) * mult) : 0;

      return { subtotal, promoDiscount, pointsUsed, pointsDiscount, total, pointsEarned, customer };
    }

      const cartBar = document.getElementById('pos-cart-bar');

    function addToCart(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      if (!prod || prod.stock <= 0) {
        showToast('Sản phẩm đã hết hàng!', 'error');
        return;
      }
      const existing = state.cart.find(c => c.id === prodId);
      if (existing) {
        if (existing.qty >= prod.stock) {
          showToast(`Chỉ còn ${prod.stock} ${prod.unit} trong kho`, 'warn');
          return;
        }
        existing.qty += 1;
      } else {
        state.cart.push({ id: prod.id, name: prod.name, price: prod.price, cost: prod.cost, qty: 1, unit: prod.unit, emoji: prod.emoji });
      }
      playBeep(1350, 0.06);
      render();
    }

            <div>
              <h3 class="font-bold text-sm text-slate-900">Thanh toán đơn hàng</h3>
              <p class="text-[11px] text-slate-500">${customer ? `Khách: ${customer.name} (${customer.points} điểm)` : 'Khách lẻ'}</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="holdCurrentBill()" class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-lg text-xs font-semibold">Treo đơn</button>
              <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
            </div>
          </div>

          <div class="p-4 space-y-3 overflow-y-auto flex-1">
            <!-- Cart Items -->
            <div class="space-y-2">
              ${state.cart.map((item, idx) => `
                <div class="flex items-center justify-between gap-2 bg-white p-2 rounded-xl border border-slate-100">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="text-lg">${item.emoji}</span>
                    <div class="min-w-0">
                      <div class="text-xs font-semibold text-slate-800 truncate">${item.name}</div>
                      <div class="text-[11px] text-emerald-700 font-semibold">${fmt(item.price)}</div>
                    </div>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="updateCartQty(${idx}, -1, '${paymentMethod}')" class="w-7 h-7 rounded-lg bg-slate-100 font-bold text-slate-700">-</button>
                    <span class="text-xs font-bold w-5 text-center">${item.qty}</span>
                    <button onclick="updateCartQty(${idx}, 1, '${paymentMethod}')" class="w-7 h-7 rounded-lg bg-emerald-100 font-bold text-emerald-700">+</button>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- Promo & Points -->
            <div class="bg-slate-50 p-3 rounded-xl space-y-2 border border-slate-200">
              <div class="flex gap-1.5">
                <input id="promo-input" type="text" value="${state.promoCode}" placeholder="Nhập hoặc chạm mã khuyến mãi..." class="flex-1 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs uppercase" />
                <button onclick="applyPromo('${paymentMethod}')" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-semibold">Áp dụng</button>
              </div>
              <div class="flex gap-1.5 flex-wrap">
                ${(state.promos || []).filter(pr => pr.active).map(pr => `
                  <button onclick="state.promoCode='${pr.code}'; openCartModal('${paymentMethod}');" class="px-2 py-1 rounded-lg text-[10px] font-bold border ${state.promoCode === pr.code ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-200'}">${pr.code} (${pr.type === 'percent' ? pr.value + '%' : fmt(pr.value)})</button>
                `).join('')}
              </div>
              ${customer ? `
                <label class="flex items-center justify-between text-xs pt-1 cursor-pointer">
                  <span class="text-slate-700 font-medium">Dùng điểm thưởng (Có <b class="text-emerald-700">${customer.points}đ</b> = ${fmt(customer.points * 100)})</span>
                  <input type="checkbox" ${state.usePoints ? 'checked' : ''} onchange="state.usePoints=this.checked; openCartModal('${paymentMethod}');" class="w-4 h-4 accent-emerald-600" />
                </label>
              ` : ''}
            </div>

            <!-- Summary -->
            <div class="space-y-1 text-xs bg-white p-3 rounded-xl border border-slate-200">
              <div class="flex justify-between text-slate-500"><span>Tạm tính:</span><span>${fmt(subtotal)}</span></div>
              ${promoDiscount > 0 ? `<div class="flex justify-between text-emerald-600"><span>Giảm giá mã KM:</span><span>-${fmt(promoDiscount)}</span></div>` : ''}
              ${pointsDiscount > 0 ? `<div class="flex justify-between text-amber-600"><span>Trừ điểm (${pointsUsed} điểm):</span><span>-${fmt(pointsDiscount)}</span></div>` : ''}
              <div class="flex justify-between text-sm font-extrabold text-slate-900 pt-1.5 border-t border-slate-100">
                <span>Tổng thanh toán:</span>
                <span class="text-emerald-700">${fmt(total)}</span>
              </div>
              ${customer ? `<div class="text-[11px] text-emerald-600 text-right">+${pointsEarned} điểm tích lũy sau đơn này</div>` : ''}
            </div>

            <!-- Payment Method -->
            <div class="space-y-2">
              <div class="text-xs font-bold text-slate-700">Phương thức thanh toán</div>
              <div class="grid grid-cols-3 gap-2">
                ${['Tiền mặt', 'VietQR', 'Thẻ / Ví'].map(m => `
                  <button onclick="openCartModal('${m}')" class="py-2 rounded-xl text-xs font-semibold border transition ${paymentMethod === m ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200'}">${m}</button>
                `).join('')}
              </div>

              ${paymentMethod === 'Tiền mặt' ? `
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs text-slate-600">Khách đưa:</span>
                    <input id="cash-input" type="number" value="${cashReceived === '' ? total : cashReceived}" oninput="updateChangeDisplay(${total})" class="w-36 px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-bold text-right" />
                  </div>
                  <div class="flex gap-1.5 flex-wrap">
                    ${[total, 100000, 200000, 500000].map(v => `
                      <button onclick="openCartModal('Tiền mặt', ${v})" class="px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] font-medium">${fmt(v)}</button>
                    `).join('')}
                  </div>
                  <div class="flex justify-between text-xs font-bold text-slate-800 pt-1 border-t border-slate-200">
                    <span>Tiền thối lại:</span>
                    <span id="change-display" class="text-rose-600">${fmt(change)}</span>
                  </div>
                </div>
              ` : paymentMethod === 'VietQR' ? `
                <div class="bg-white p-3 rounded-xl border border-emerald-200 flex items-center gap-3">
                  <div class="w-20 h-20 bg-slate-900 rounded-xl p-1.5 shrink-0 flex items-center justify-center">
                    <svg viewBox="0 0 36 36" class="w-full h-full text-white" fill="currentColor">
                      <rect x="2" y="2" width="10" height="10" rx="1"/><rect x="4" y="4" width="6" height="6" fill="#0f172a"/><rect x="6" y="6" width="2" height="2"/>
                      <rect x="24" y="2" width="10" height="10" rx="1"/><rect x="26" y="4" width="6" height="6" fill="#0f172a"/><rect x="28" y="6" width="2" height="2"/>
                      <rect x="2" y="24" width="10" height="10" rx="1"/><rect x="4" y="26" width="6" height="6" fill="#0f172a"/><rect x="6" y="28" width="2" height="2"/>
                      <rect x="15" y="4" width="3" height="3"/><rect x="15" y="10" width="6" height="3"/><rect x="15" y="16" width="3" height="6"/><rect x="21" y="16" width="6" height="3"/><rect x="24" y="24" width="4" height="4"/><rect x="30" y="28" width="4" height="6"/>
                    </svg>
                  </div>
                  <div class="text-xs space-y-0.5">
                    <div class="font-bold text-emerald-700">VietQR • SmartMart</div>
                    <div class="text-slate-600">Số tiền: <b class="text-slate-900">${fmt(total)}</b></div>
                    <div class="text-[11px] text-slate-400">Tự động xác nhận khi khách quét</div>
                  </div>
                </div>
              ` : `
                <div class="bg-blue-50 p-2.5 rounded-xl border border-blue-200 text-xs text-blue-800">
                  Kết nối máy POS quẹt thẻ / Ví MoMo, ZaloPay: <b>${fmt(total)}</b>
                </div>
              `}
            </div>
          </div>

          <div class="p-3 border-t border-slate-200 bg-white">
            <button onclick="completeCheckout('${paymentMethod}')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-2xl shadow-md active:scale-[0.99] transition">
              Xác nhận Thanh toán • ${fmt(total)}
            </button>
          </div>
        </div>
      `);
    }

    function updateChangeDisplay(total) {
      const val = Number(document.getElementById('cash-input')?.value || 0);
      const disp = document.getElementById('change-display');
      if (disp) disp.textContent = fmt(Math.max(0, val - total));
    }

    function updateCartQty(idx, delta, method) {
      const item = state.cart[idx];
      if (!item) return;
      const prod = state.products.find(p => p.id === item.id);
      const next = item.qty + delta;
      if (next <= 0) state.cart.splice(idx, 1);
      else if (prod && next > prod.stock) { showToast(`Kho chỉ còn ${prod.stock}`, 'warn'); return; }
      else item.qty = next;
      render();
      openCartModal(method);
    }

    function applyPromo(method) {
      const val = document.getElementById('promo-input')?.value || '';
      state.promoCode = val.trim().toUpperCase();
      const { promoDiscount } = calcCartTotals();
      if (state.promoCode && promoDiscount === 0) showToast('Mã chưa hợp lệ hoặc chưa đạt giá trị tối thiểu', 'warn');
      else if (promoDiscount > 0) showToast(`Đã giảm ${fmt(promoDiscount)}!`);
      openCartModal(method);
    }

    function holdCurrentBill() {
      const cust = state.customers.find(c => c.id === state.selectedCustomerId);
      const now = new Date();
      const time = now.toTimeString().slice(0, 5);
      state.heldBills.push({
        time,
        customerId: state.selectedCustomerId,
        customerName: cust ? cust.name : 'Khách lẻ',
        cart: JSON.parse(JSON.stringify(state.cart))
      });
      state.cart = [];
      state.selectedCustomerId = null;
      state.promoCode = '';
      state.usePoints = false;
      closeModal();
      render();
      showToast('Đã treo đơn hàng tạm thời!');
    }

    function completeCheckout(method) {
      const { subtotal, promoDiscount, pointsUsed, pointsDiscount, total, pointsEarned, customer } = calcCartTotals();
      state.cart.forEach(ci => {
        const p = state.products.find(pr => pr.id === ci.id);
        if (p) p.stock = Math.max(0, p.stock - ci.qty);
      });
      if (customer) {
        customer.points = Math.max(0, customer.points - pointsUsed) + pointsEarned;
        customer.totalSpent += total;
        customer.visits += 1;
        customer.lastVisit = '2026-11-15';
        if (customer.totalSpent >= 15000000) customer.tier = 'Kim Cương';
        else if (customer.totalSpent >= 7000000) customer.tier = 'Vàng';
        else if (customer.totalSpent >= 3000000) customer.tier = 'Bạc';
      }

      const now = new Date();
      const time = now.toTimeString().slice(0, 5);
      const orderId = `HD-261115-${String(state.orders.length + 1).padStart(2, '0')}`;
      const newOrder = {
        id: orderId,
        time,
        branch: state.shift.branch,
        cashier: state.shift.cashier,
        customerId: customer ? customer.id : null,
        customerName: customer ? customer.name : 'Khách lẻ',
        items: JSON.parse(JSON.stringify(state.cart)),
        subtotal,
        discount: promoDiscount + pointsDiscount,
        pointsUsed,
        total,
        pointsEarned,
        method,
        status: 'Hoàn thành'
      };
      state.orders.unshift(newOrder);

      if (promoDiscount > 0) {
        state.auditLogs.unshift({
          id: 'AL' + Date.now(),
          time,
          branch: state.shift.branch,
          staff: state.shift.cashier,
          action: `Áp dụng mã ${state.promoCode}`,
          detail: `Giảm ${fmt(promoDiscount)} cho ${orderId}`,
          level: 'warn'
        });
      }

      state.cart = [];
      state.selectedCustomerId = null;
      state.promoCode = '';
      state.usePoints = false;
      playBeep(1600, 0.12);
      render();
      openReceiptModal(newOrder);
    }

    function openReceiptModal(order) {
      openModal(`
        <div class="p-4 space-y-3 overflow-y-auto max-h-[88vh]">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full">✓ Thanh toán thành công</span>
            <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
          </div>
          <div class="k80-receipt p-3.5 rounded-xl text-[11px] text-slate-800 space-y-2">
            <div class="text-center border-b border-dashed border-slate-300 pb-2">
              <div class="font-bold text-sm">SIÊU THỊ SMARTMART</div>
              <div>${order.branch} • ĐT: 0276.3888.999</div>
              <div class="font-bold mt-1">HÓA ĐƠN BÁN LẺ (K80)</div>
              <div>Số: ${order.id} • ${order.time} 15/11/2026</div>
              <div>Thu ngân: ${order.cashier}</div>
              <div>Khách: ${order.customerName}</div>
            </div>
            <div class="space-y-1 border-b border-dashed border-slate-300 pb-2">
              ${order.items.map(i => `
                <div class="flex justify-between gap-2">
                  <span class="truncate flex-1">${i.name} x${i.qty}</span>
                  <span class="font-semibold">${fmt(i.price * i.qty)}</span>
                </div>
              `).join('')}
            </div>
            <div class="space-y-0.5">
              <div class="flex justify-between"><span>Tạm tính:</span><span>${fmt(order.subtotal)}</span></div>
              ${order.discount > 0 ? `<div class="flex justify-between"><span>Giảm giá/Điểm:</span><span>-${fmt(order.discount)}</span></div>` : ''}
              <div class="flex justify-between font-bold text-sm pt-1"><span>THÀNH TIỀN:</span><span>${fmt(order.total)}</span></div>
              <div class="flex justify-between text-[10px]"><span>Thanh toán (${order.method}):</span><span>${fmt(order.total)}</span></div>
              ${order.pointsEarned > 0 ? `<div class="text-center font-semibold pt-1">Điểm tích lũy cộng thêm: +${order.pointsEarned} điểm</div>` : ''}
            </div>
            <div class="text-center text-[10px] text-slate-500 pt-2 border-t border-dashed border-slate-300">
              Cảm ơn Quý khách! Hẹn gặp lại!
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="showToast('Đã gửi lệnh in máy in nhiệt K80!');" class="py-2.5 bg-slate-900 text-white rounded-xl text-xs font-semibold">🖨️ In hóa đơn K80</button>
            <button onclick="closeModal()" class="py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Đơn hàng mới</button>
          </div>
        </div>
      `);
    }

    // ---------- TAB 2: CRM & LOYALTY ----------
    function renderCRM(container) {
      const sub = state.crmSubTab;
      container.innerHTML = `
        <div class="p-3 space-y-3">
          <div class="grid grid-cols-3 gap-1.5 bg-slate-200/70 p-1 rounded-xl">
            <button data-crm="list" class="crm-sub-btn py-2 rounded-lg text-xs font-semibold transition ${sub === 'list' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600'}">Khách hàng</button>
            <button data-crm="gifts" class="crm-sub-btn py-2 rounded-lg text-xs font-semibold transition ${sub === 'gifts' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600'}">Đổi quà</button>
            <button data-crm="care" class="crm-sub-btn py-2 rounded-lg text-xs font-semibold transition ${sub === 'care' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600'}">Chăm sóc</button>
          </div>
          <div id="crm-body"></div>
        </div>
      `;

            </div>
            ${state.customers.map(c => `

                  <div>

                      <span class="text-sm font-bold text-slate-900">${c.name}</span>

                  </div>

                  </div>
                </div>

                <div class="flex gap-2 pt-1">
                  <button onclick="state.selectedCustomerId='${c.id}'; state.activeTab='pos'; render(); showToast('Đã chọn ${c.name} vào quầy POS');" class="flex-1 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-semibold">Bán hàng</button>
                  <button onclick="state.selectedCustomerId='${c.id}'; state.crmSubTab='gifts'; render();" class="flex-1 py-1.5 bg-amber-50 text-amber-700 rounded-lg text-xs font-semibold">Đổi quà</button>
                  <button onclick="openCareMessageModal('${c.id}')" class="flex-1 py-1.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-semibold">Gửi Zalo</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        document.getElementById('btn-new-customer').addEventListener('click', openAddCustomerModal);
      } else if (sub === 'gifts') {
        const selCust = state.customers.find(c => c.id === state.selectedCustomerId) || state.customers[0];
        body.innerHTML = `
          <div class="space-y-3">
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-3.5 rounded-2xl shadow-sm">
              <div class="text-[11px] opacity-90 mb-1">Khách hàng đang đổi quà:</div>
              <div class="flex items-center justify-between gap-2">
                <select id="gift-cust-select" class="bg-white/20 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl border border-white/30 focus:outline-none">
                  ${state.customers.map(c => `<option value="${c.id}" class="text-slate-900" ${selCust.id === c.id ? 'selected' : ''}>${c.name} (${c.points} điểm)</option>`).join('')}
                </select>

                  <div class="text-lg font-extrabold">${selCust.points} điểm</div>

                      Đổi ngay
                    </button>
                  </div>
                `;

            ${state.redemptions.length > 0 ? `
              <div class="bg-white p-3 rounded-2xl border border-slate-200">
                <div class="text-xs font-bold text-slate-800 mb-2">Lịch sử đổi quà gần đây</div>

    function redeemGift(custId, giftId) {
      const cust = state.customers.find(c => c.id === custId);
      const gift = state.gifts.find(g => g.id === giftId);
      if (!cust || !gift || cust.points < gift.pointsCost || gift.stock <= 0) return;
      cust.points -= gift.pointsCost;
      gift.stock -= 1;
      const time = new Date().toTimeString().slice(0, 5);
      state.redemptions.unshift({ customerName: cust.name, giftName: gift.name, points: gift.pointsCost, time });
      playBeep(1500, 0.1);
      render();
      showToast(`Đổi thành công "${gift.name}" cho ${cust.name}!`);
    }

    function refundOrder(orderId) {
      const o = state.orders.find(x => x.id === orderId);
      if (!o || o.status !== 'Hoàn thành') return;
      o.status = 'Đã hoàn trả';
      o.items.forEach(i => {
        const p = state.products.find(pr => pr.id === i.id);
        if (p) p.stock += i.qty;
      });
      if (o.customerId) {
        const c = state.customers.find(cu => cu.id === o.customerId);
        if (c) c.points = Math.max(0, c.points - o.pointsEarned);
      }
      state.auditLogs.unshift({
        id: 'AL' + Date.now(),
        time: new Date().toTimeString().slice(0, 5),
        branch: o.branch,
        staff: state.shift.cashier,
        action: `Hoàn trả ${o.id}`,
        detail: `Hoàn ${fmt(o.total)} & nhập lại kho`,
        level: 'danger'
      });
      render();
      showToast(`Đã hoàn trả ${orderId} và cộng lại tồn kho!`);
    }

          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-xs font-bold text-slate-800">Biểu đồ doanh thu theo khung giờ</h3>
              <span class="text-[10px] text-emerald-600 font-semibold">Hôm nay</span>
            </div>
            <div class="relative h-48">
              <canvas id="owner-revenue-chart"></canvas>
            </div>
          </div>

          <!-- Remote Staff & Audit Monitor -->
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-800">Giám sát quầy & Nhật ký nhạy cảm</h3>
              <span class="text-[10px] bg-rose-50 text-rose-700 font-semibold px-2 py-0.5 rounded-full">Chống thất thoát</span>
            </div>
            <div class="space-y-1.5">
              ${state.auditLogs.slice(0, 5).map(a => `
                <div class="flex items-start justify-between gap-2 text-[11px] p-2 rounded-xl ${a.level === 'danger' ? 'bg-rose-50 text-rose-900' : a.level === 'warn' ? 'bg-amber-50 text-amber-900' : 'bg-slate-50 text-slate-700'}">
                  <div>
                    <div class="font-bold">${a.action} • ${a.staff}</div>
                    <div class="opacity-80">${a.detail} (${a.branch})</div>
                  </div>
                  <span class="text-[10px] opacity-70 shrink-0">${a.time}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Low Stock Alert -->
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-800">Cảnh báo tồn kho từ xa (${lowStockItems.length})</h3>
              <button onclick="state.activeTab='inventory'; state.invFilter='low'; render();" class="text-[11px] font-semibold text-emerald-600">Xử lý nhập kho →</button>
            </div>
            <div class="space-y-1.5">
              ${lowStockItems.map(p => `
                <div class="flex items-center justify-between text-xs py-1 border-b border-slate-100 last:border-0">
                  <span class="truncate text-slate-700">${p.emoji} ${p.name}</span>
                  <span class="font-bold text-rose-600 shrink-0 ml-2">Còn ${p.stock} ${p.unit}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('owner-branch-select').addEventListener('change', (e) => {
        state.ownerBranch = e.target.value;
        render();
      });

      const ctx = document.getElementById('owner-revenue-chart').getContext('2d');
      if (ownerChartInstance) ownerChartInstance.destroy();
      const hours = ['08h', '09h', '10h', '11h', '12h', '13h', '14h'];
      const hourlyData = hours.map(h => {
        const prefix = h.slice(0, 2);
        return branchOrders.filter(o => o.time.startsWith(prefix)).reduce((s, o) => s + o.total, 0);
      });
      if (typeof Chart === 'undefined') {
        const box = document.getElementById('owner-revenue-chart').parentElement;
        const maxVal = Math.max(1, ...hourlyData);
        box.innerHTML = `<div class="h-full flex items-end justify-between gap-2 pt-4 pb-1 px-1">` +
          hours.map((h, i) => `<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">
            <div class="w-full bg-emerald-500 rounded-t" style="height:${Math.max(4, Math.round((hourlyData[i]/maxVal)*100))}%"></div>
            <span class="text-[10px] text-slate-500">${h}</span>
          </div>`).join('') + `</div>`;
        return;
      }
      ownerChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: hours,
          datasets: [{
            label: 'Doanh thu (đ)',
            data: hourlyData,
            backgroundColor: '#10b981',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                font: { size: 10 },
                callback: (v) => (v >= 1000 ? (v / 1000) + 'k' : v)
              }
            },
            x: { ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    // ==========================================
    // 3B. OWNER MANAGEMENT: CATEGORIES, PRICES, PROMOS
    // ==========================================
    function openCategoryManagerModal() {
      openModal(`
        <div class="p-4 space-y-3 overflow-y-auto max-h-[88vh]">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm text-slate-900">Quản lý Danh mục hàng</h3>
            <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
          </div>
          <div class="flex gap-2">
            <input id="new-cat-input" type="text" placeholder="Tên danh mục mới (VD: Gia vị)" class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-xs" />
            <button onclick="addOwnerCategory()" class="px-3 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shrink-0">+ Thêm</button>
          </div>
          <div class="space-y-1.5 max-h-72 overflow-y-auto">
            ${state.categories.map((cat, idx) => {
              const count = state.products.filter(p => p.category === cat).length;
              return `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                  <div>
                    <div class="text-xs font-bold text-slate-800">${cat}</div>
                    <div class="text-[10px] text-slate-500">${count} sản phẩm</div>
                  </div>
                  <button onclick="removeOwnerCategory(${idx})" class="px-2.5 py-1 bg-rose-50 text-rose-700 rounded-lg text-[11px] font-semibold">Xóa</button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `);
    }

    function addOwnerCategory() {
      const val = (document.getElementById('new-cat-input')?.value || '').trim();
      if (!val) { showToast('Vui lòng nhập tên danh mục', 'warn'); return; }
      if (state.categories.includes(val)) { showToast('Danh mục này đã tồn tại', 'warn'); return; }
      state.categories.push(val);
      render();
      openCategoryManagerModal();
      showToast(`Đã thêm danh mục "${val}"`);
    }

    function removeOwnerCategory(idx) {
      if (state.categories.length <= 1) { showToast('Cần giữ lại ít nhất 1 danh mục', 'warn'); return; }
      const removed = state.categories[idx];
      state.categories.splice(idx, 1);
      const fallback = state.categories[0];
      state.products.forEach(p => { if (p.category === removed) p.category = fallback; });
      if (state.posCategory === removed) state.posCategory = 'Tất cả';
      render();
      openCategoryManagerModal();
      showToast(`Đã xóa danh mục "${removed}"`);
    }

    function openPriceManagerModal() {
      openModal(`
        <div class="p-4 space-y-3 overflow-y-auto max-h-[88vh]">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm text-slate-900">Đặt lại Bảng giá bán & Giá vốn</h3>
            <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
          </div>
          <div class="flex items-center justify-between bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-[11px] text-amber-900">
            <span>Sửa giá trực tiếp sẽ đồng bộ ngay xuống máy Thu ngân.</span>
            <button onclick="resetAllPrices()" class="px-2 py-1 bg-white border border-amber-300 rounded-lg font-bold text-amber-800 shrink-0 ml-2">Khôi phục gốc</button>
          </div>
          <div class="space-y-2 max-h-80 overflow-y-auto">
            ${state.products.map((p, idx) => `
              <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 space-y-1.5">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-bold text-slate-800 truncate">${p.emoji} ${p.name}</span>
                  <span class="text-[10px] text-slate-500 shrink-0">${p.category}</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-[10px] text-slate-500 block">Giá bán (đ)</label>
                    <input id="pm-price-${idx}" type="number" value="${p.price}" class="w-full px-2 py-1 border border-slate-300 rounded-lg text-xs font-bold text-emerald-700" />
                  </div>
                  <div>
                    <label class="text-[10px] text-slate-500 block">Giá vốn (đ)</label>
                    <input id="pm-cost-${idx}" type="number" value="${p.cost}" class="w-full px-2 py-1 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700" />
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          <button onclick="saveAllPrices()" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Lưu toàn bộ Bảng giá mới</button>
        </div>
      `);
    }

    function saveAllPrices() {
      state.products.forEach((p, idx) => {
        const np = Number(document.getElementById(`pm-price-${idx}`)?.value || p.price);
        const nc = Number(document.getElementById(`pm-cost-${idx}`)?.value || p.cost);
        if (np > 0) p.price = np;
        if (nc >= 0) p.cost = nc;
      });
      closeModal();
      render();
      showToast('Đã cập nhật bảng giá mới toàn hệ thống!');
    }

    function resetAllPrices() {
      state.products.forEach(p => {
        const orig = INITIAL_PRODUCTS.find(x => x.id === p.id);
        if (orig) { p.price = orig.price; p.cost = orig.cost; }
      });
      render();
      openPriceManagerModal();
      showToast('Đã khôi phục bảng giá gốc!');
    }

    function openPromoManagerModal() {
      openModal(`
        <div class="p-4 space-y-3 overflow-y-auto max-h-[88vh]">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm text-slate-900">Chương trình Khuyến mãi</h3>
            <button onclick="closeModal()" class="text-slate-400 text-lg font-bold px-2">✕</button>
          </div>
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
            <div class="text-[11px] font-bold text-slate-700">Tạo mã khuyến mãi mới</div>
            <div class="grid grid-cols-2 gap-2">
              <input id="pr-code" type="text" placeholder="Mã (VD: TET2027)" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs uppercase font-bold" />
              <select id="pr-type" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs">
                <option value="percent">Giảm theo %</option>
                <option value="fixed">Giảm tiền (đ)</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input id="pr-val" type="number" placeholder="Mức giảm (% hoặc đ)" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs" />
              <input id="pr-min" type="number" placeholder="Đơn tối thiểu (đ)" value="0" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs" />
            </div>
            <input id="pr-name" type="text" placeholder="Tên chương trình (VD: Khai trương giảm 15%)" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs" />
            <button onclick="addOwnerPromo()" class="w-full py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">+ Thêm chương trình KM</button>
          </div>

          <div class="space-y-2 max-h-60 overflow-y-auto">
            ${state.promos.map((pr, idx) => `
              <div class="p-2.5 bg-white rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="text-xs font-extrabold text-emerald-700">${pr.code}</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold ${pr.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${pr.active ? 'Đang bật' : 'Đã tắt'}</span>
                  </div>
                  <div class="text-[11px] text-slate-600 truncate">${pr.name} • Giảm ${pr.type === 'percent' ? pr.value + '%' : fmt(pr.value)}</div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button onclick="toggleOwnerPromo(${idx})" class="px-2 py-1 bg-slate-100 text-slate-700 rounded-lg text-[11px] font-semibold">${pr.active ? 'Tắt' : 'Bật'}</button>
                  <button onclick="deleteOwnerPromo(${idx})" class="px-2 py-1 bg-rose-50 text-rose-700 rounded-lg text-[11px] font-semibold">Xóa</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    function addOwnerPromo() {
      const code = (document.getElementById('pr-code')?.value || '').trim().toUpperCase();
      const type = document.getElementById('pr-type')?.value || 'percent';
      const value = Number(document.getElementById('pr-val')?.value || 0);
      const minOrder = Number(document.getElementById('pr-min')?.value || 0);
      const name = (document.getElementById('pr-name')?.value || '').trim() || `Ưu đãi ${code}`;
      if (!code || value <= 0) { showToast('Nhập mã và mức giảm hợp lệ', 'warn'); return; }
      state.promos.unshift({ id: 'PR' + Date.now(), code, name, type, value, minOrder, active: true });
      render();
      openPromoManagerModal();
      showToast(`Đã tạo mã khuyến mãi ${code}!`);
    }

    function toggleOwnerPromo(idx) {
      if (!state.promos[idx]) return;
      state.promos[idx].active = !state.promos[idx].active;
      render();
      openPromoManagerModal();
    }

    function deleteOwnerPromo(idx) {
      state.promos.splice(idx, 1);
      render();
      openPromoManagerModal();
      showToast('Đã xóa chương trình khuyến mãi');
    }

    // ==========================================
    // 4. GLOBAL NAVIGATION & INIT
    // ==========================================
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('btn-role-switch').addEventListener('click', () => {
      state.activeTab = state.activeTab === 'owner' ? 'pos' : 'owner';
      render();
    });

    window.addEventListener('DOMContentLoaded', () => { render(true); startCloudPolling(); if (cloudConfig.enabled) pullFromCloud(true); });
  </script>
</body>
</html>
